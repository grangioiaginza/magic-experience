<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gran GIOIA Ginza - Digital Magic</title>
    <style>
        /* 1. 基本レイアウト */
        body { 
            background-color: #000; 
            color: #f1d592; 
            font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; 
            text-align: center; 
            margin: 0; 
            overflow: hidden; 
            touch-action: none;
            /* 画面中央に配置 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            width: 100%;
            max-width: 900px;
            position: relative; /* 疑似要素の親として */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #2a2a2a 0%, #000 100%);
        }
        
        /* 背景画像：ロゴを非常に薄く透かしのように */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_12.png');
            background-size: cover;
            background-position: center;
            opacity: 0.1; /* かなり薄く（10%） */
            z-index: -1; /* コンテンツの後ろへ */
        }
        
        /* 2. メッセージ */
        #msg-container { height: 180px; width: 100%; min-width: 800px; position: relative; z-index: 100; overflow: visible; display: flex; justify-content: center; align-items: center; }
        .msg-line { 
            position: absolute; width: 100%; left: 0; 
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); 
            opacity: 0; font-size: 1.5rem; font-weight: normal; line-height: 1.6; letter-spacing: 0.15em; 
            text-shadow: 0 0 25px rgba(0,0,0,1);
            white-space: nowrap; /* 強制的に1行にする */
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(70px); }

        /* 3. カード演出エリア */
        #card-table { display: flex; justify-content: center; align-items: center; height: 350px; position: relative; width: 100%; max-width: 900px; margin-top: -20px; }
        .card { width: 130px; height: 195px; position: absolute; perspective: 1000px; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 0; filter: blur(10px); }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; filter: blur(0); }

        /* スタック時の影抑制（重なりを綺麗に） */
        .card.stacked { box-shadow: none !important; }
        .card.stacked .card-face { box-shadow: 0 2px 8px rgba(0,0,0,0.8) !important; }

        /* 黄金の輝きエフェクト（消失マジック） */
        .golden-glow {
            box-shadow: 0 0 80px 25px rgba(241, 213, 146, 1) !important;
            filter: brightness(1.4) drop-shadow(0 0 25px #f1d592) !important;
            z-index: 1000 !important;
        }

        /* 浮遊・消失アニメーション */
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--base-rot)); } 50% { transform: translateY(-12px) rotate(calc(var(--base-rot) + 2deg)); } }
        .floating { animation: float 3.5s infinite ease-in-out; }
        .juwa-out { animation: juwa-out 3.5s forwards; }
        @keyframes juwa-out { from { opacity: 1; filter: blur(0) brightness(1.5); transform: scale(1.1); } to { opacity: 0; filter: blur(80px) brightness(4); transform: scale(2.0); } }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 10, 30, 0.8); background-size: cover; background-position: center; border: 0.3px solid rgba(241, 213, 146, 0.4); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        /* 4. タイマー（位置修正：QSと被らないように上へ移動） */
        #timer { 
            font-size: 7.5rem; font-weight: bold; color: #fff; position: absolute; top: 15%; /* カードよりかなり上に配置 */
            left: 50%; transform: translate(-50%, -50%); 
            opacity: 0; pointer-events: none; z-index: 600; font-family: serif;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 50px rgba(0,0,0,1), 0 0 70px rgba(0,0,0,1);
        }
        
        #version-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: rgba(241,213,146,0.3); z-index: 2000; }
        #orientation-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; visibility: hidden; opacity: 0; transition: 0.5s; }
        @media screen and (orientation: portrait) { #orientation-overlay { visibility: visible; opacity: 1; } }
        .hidden { display: none !important; }
        #reserve-ui { padding: 40px; transition: 2s; opacity: 0; }
        .btn { background: #f1d592; border: none; padding: 15px 45px; border-radius: 40px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; margin-top: 20px; }
    </style>
</head>
<body>

<div id="orientation-overlay">
    <p>画面を横にして、"奇跡"をお楽しみください</p>
    <div style="font-size: 3rem; margin-top: 20px;">🔄</div>
</div>

<div id="version-info">Ver. Final | Build 14:15</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="card-table"></div>
        <div id="timer">8</div>
    </div>

    <div id="reserve-ui" class="hidden">
        <h1>不思議を感じましたか？</h1>
        <p style="line-height: 2.2;">Gran GIOIA Ginza では、<br>WEBでは決して体験できない<br>「このレベルではない軌跡」をお届けします。</p>
        <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
    </div>
</div>

<script>
    // 画像・定数設定
    const cardsSetA = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
    const cardsSetB = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
    const table = document.getElementById('card-table');
    const timerDisplay = document.getElementById('timer');
    const msgContainer = document.getElementById('msg-container');

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('mode') === 'gioia_admin';

    window.onload = () => {
        if (!isAdmin && localStorage.getItem('gioia_magic_played')) {
            showReserve();
        } else {
            if (isAdmin) localStorage.removeItem('gioia_magic_played');
            initMagic();
        }
    };

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function pushMsg(newText) {
        const currentLines = msgContainer.querySelectorAll('.msg-line');
        currentLines.forEach(line => {
            if (line.classList.contains('top')) {
                line.classList.replace('top', 'exit');
                setTimeout(() => line.remove(), 1200);
            } else if (line.classList.contains('center')) {
                line.classList.replace('center', 'top');
            }
        });

        const newLine = document.createElement('div');
        newLine.className = 'msg-line bottom';
        newLine.innerHTML = newText;
        msgContainer.appendChild(newLine);
        newLine.offsetHeight; 
        setTimeout(() => newLine.classList.replace('bottom', 'center'), 50);
    }

    async function initMagic() {
        await sleep(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
        await sleep(2500);

        cardsSetA.forEach((img, i) => {
            const card = document.createElement('div');
            card.className = 'card is-back juwa-in stacked';
            card.style.left = `calc(50% - 65px)`;
            card.style.zIndex = i;
            card.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${img}')"></div><div class="card-face card-back"></div></div>`;
            table.appendChild(card);
        });

        await sleep(2000);
        pushMsg("この五枚のトランプの中から、直感で一枚を頭に強く念じてください。");
        
        await sleep(3000);
        const cards = document.querySelectorAll('.card');
        cards.forEach((c, i) => {
            const offset = (i - 2) * 155;
            const rot = (i - 2) * 5;
            c.classList.remove('juwa-in', 'stacked');
            c.style.left = `calc(50% - 65px + ${offset}px)`;
            c.style.setProperty('--base-rot', `${rot}deg`);
            c.style.transform = `rotate(${rot}deg)`;
        });

        await sleep(2500);
        pushMsg("スマートフォンのマイクが、<br>あなたの声を拾うかもしれません。");
        await sleep(4500);
        pushMsg("声に出さずあなたの頭の中だけで、<br>一枚のマークと数字をしっかりと念じてください。");
        await sleep(4500);

        for (let c of cards) {
            c.classList.remove('is-back');
            c.classList.add('floating');
            await sleep(250);
        }

        timerDisplay.style.opacity = 1;
        for (let i = 8; i >= 0; i--) {
            timerDisplay.innerText = i;
            if (i === 0) break;
            await sleep(900);
        }

        timerDisplay.style.opacity = 0;
        cards.forEach(c => {
            c.classList.add('is-back', 'stacked');
            c.classList.remove('floating');
            c.style.left = `calc(50% - 65px)`;
            c.style.transform = `rotate(0deg)`;
        });

        await sleep(1000);
        pushMsg("シャッフルしています…");

        // --- リアル・ディーラーシャッフル (右・左・右) ---
        const moveCard = async (index, direction) => {
            const c = cards[index];
            const originalZ = c.style.zIndex;
            c.style.zIndex = 500;
            const xMove = direction === 'right' ? 180 : -180;
            c.style.transition = "all 0.5s cubic-bezier(0.4, 0, 0.2, 1)";
            c.style.left = `calc(50% - 65px + ${xMove}px)`;
            c.style.transform = "rotate(10deg) translateY(-20px)";
            await sleep(550);
            c.style.zIndex = 400; // 重なり順を上へ
            c.style.left = 'calc(50% - 65px)';
            c.style.transform = "rotate(0deg) translateY(0px)";
            await sleep(500);
        };

        await moveCard(4, 'right');
        await moveCard(3, 'left');
        await moveCard(2, 'right');

        await sleep(800);
        
        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        
        // 5枚に広げる
        await sleep(1000);
        cards.forEach((c, i) => {
            const offset = (i - 2) * 125;
            const rot = (i - 2) * 4;
            c.classList.remove('stacked');
            c.style.left = `calc(50% - 65px + ${offset}px)`;
            c.style.transform = `rotate(${rot}deg)`;
        });

        // --- 黄金の消失演出 ---
        await sleep(1500);
        // SetAの真ん中の一枚（QS）を特定
        const vanishCard = cards[2]; 
        
        // 黄金の輝きを追加
        vanishCard.classList.add('golden-glow');
        
        // ゆっくりとせり上がらせ、消失アニメーションを長くする
        vanishCard.style.transition = "top 5.0s cubic-bezier(0.4, 0, 0.2, 1), transform 3.0s, opacity 2.0s, filter 2.0s"; 
        vanishCard.style.top = '-220px'; // より高く
        vanishCard.style.transform = 'scale(1.2)'; // 少し大きくして強調
        
        await sleep(4500); // せり上がった状態で少し待つ

        // ジュワッと消失
        vanishCard.classList.add('juwa-out');
        await sleep(3500); // 消失の余韻を長く

        pushMsg("あなたのカードだけが、消えました。");
        table.innerHTML = '';
        cardsSetB.forEach((img, i) => {
            const card = document.createElement('div');
            card.className = 'card is-back is-visible';
            const offset = (i - 1.5) * 155;
            const rot = (i - 1.5) * 5;
            card.style.left = `calc(50% - 65px + ${offset}px)`;
            card.style.setProperty('--base-rot', `${rot}deg`);
            card.style.transform = `rotate(${rot}deg)`;
            card.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${img}')"></div><div class="card-face card-back"></div></div>`;
            table.appendChild(card);
        });

        await sleep(1500);
        const finalCards = document.querySelectorAll('.card');
        for (let c of finalCards) {
            c.classList.remove('is-back');
            c.classList.add('floating');
            await sleep(650);
        }

        if (!isAdmin) localStorage.setItem('gioia_magic_played', 'true');
        await sleep(5500);
        showReserve();
    }

    function showReserve() {
        document.getElementById('game-ui').style.opacity = 0;
        setTimeout(() => {
            document.getElementById('game-ui').classList.add('hidden');
            const res = document.getElementById('reserve-ui');
            res.classList.remove('hidden');
            setTimeout(() => res.style.opacity = 1, 100);
        }, 1200);
    }
</script>
</body>
</html>
