<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        :root {
            --card-w: 27vw;
            --card-h: calc(var(--card-w) * 1.5);
            --max-card-w: 169px;
            --max-card-h: 253px;
            --accent: #f1d592;
        }
        @media (min-width: 600px) {
            :root { --card-w: var(--max-card-w); --card-h: var(--max-card-h); }
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: var(--accent); font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); z-index: 1; }
        #bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('./SocialCover.webp') center/cover no-repeat; z-index: 2; opacity: 0; transition: opacity 2s; }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 3; }
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        #entrance { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); transition: opacity 0.8s; }
        .entrance-logo { font-size: 1.4rem; letter-spacing: 0.2em; margin-bottom: 50px; text-align: center; text-shadow: 0 0 20px #000; padding: 0 20px; line-height: 1.6; }
        .start-btn { background: var(--accent); color: #000; border: none; padding: 20px 45px; font-size: 1.1rem; font-weight: bold; cursor: pointer; letter-spacing: 0.2em; min-width: 240px; box-shadow: 0 0 30px rgba(241,213,146,0.5); }

        #en-subtitle { 
            position: fixed; bottom: 40px; width: 90%; left: 5%; text-align: center; font-size: 1.3rem; color: #fff; z-index: 100; font-family: 'Times New Roman', serif; 
            letter-spacing: 0.05em; text-shadow: 0 2px 8px #000; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; line-height: 1.3; white-space: pre-wrap; opacity: 0; transition: opacity 0.5s;
        }

        #game-ui { width: 100%; margin-top: 5vh; display: none; }
        #msg-container { height: 100px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .msg-line { position: absolute; width: 90%; display: flex; align-items: center; justify-content: center; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.1rem; letter-spacing: 0.1em; text-shadow: 0 0 25px #000; line-height: 1.4; }
        .msg-line.center { opacity: 1; transform: translateY(0); }

        #sub-msg-area { height: 160px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 50; }
        #timer { font-size: 5rem; font-weight: bold; color: #fff; opacity: 0; text-shadow: 0 0 50px #000; transition: opacity 0.5s; height: 100px; display: flex; align-items: center; }
        #dynamic-text { opacity: 0; transition: opacity 1.2s ease; font-size: 1rem; letter-spacing: 0.05em; color: var(--accent); text-align: center; line-height: 1.6; text-shadow: 0 0 20px #000; padding: 0 15px; position: absolute; top: 90px; }

        #card-table { height: 400px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; transition: opacity 2s ease; margin-top: 10px; }
        .card { width: var(--card-w); height: var(--card-h); max-width: var(--max-card-w); max-height: var(--max-card-h); position: absolute; left: 50%; margin-left: calc(var(--card-w) / -2); perspective: 1200px; opacity: 0; pointer-events: none; transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        @keyframes magicFloat { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 15px)) rotate(calc(var(--base-rot) + 1.2deg)); } 
        }
        .floating { animation: magicFloat 3.5s infinite ease-in-out !important; }

        /* 上昇アニメーション */
        @keyframes cinematicRise {
            0% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); filter: drop-shadow(0 0 10px var(--accent)) brightness(1.1); }
            30% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); filter: drop-shadow(0 0 30px var(--accent)) brightness(2.0); }
            100% { transform: translate(var(--base-tx), -240px) rotate(5deg); filter: drop-shadow(0 0 60px var(--accent)) brightness(3.5); }
        }
        .miracle-rise { animation: cinematicRise 3.8s forwards cubic-bezier(0.33, 0, 0.67, 1) !important; }

        /* 消失バースト */
        @keyframes cinematicVanish {
            0% { filter: drop-shadow(0 0 60px var(--accent)) brightness(3.5); transform: translate(var(--base-tx), -240px) rotate(5deg) scale(1.0); opacity: 1; }
            30% { filter: drop-shadow(0 0 120px #fff) brightness(30) blur(5px); transform: translate(var(--base-tx), -270px) rotate(8deg) scale(1.2); opacity: 1; }
            100% { filter: drop-shadow(0 0 250px var(--accent)) brightness(80) blur(120px); transform: translate(var(--base-tx), -450px) rotate(15deg) scale(3.0); opacity: 0; }
        }
        .vanish-action { animation: cinematicVanish 1.8s forwards cubic-bezier(0.4, 0, 0.2, 1) !important; }
        
        #reserve-ui { position: absolute; top: 68%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2s ease; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn { background: var(--accent); border: none; padding: 18px 30px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1rem; width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-decoration: none; display: flex; align-items: center; justify-content: center; }

        /* Build情報の透明化 */
        #status-info { position: fixed; bottom: 8px; right: 8px; font-size: 9px; color: var(--accent); z-index: 10001; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-image"></div>
<div id="bg-curtain"></div>
<div id="status-info">Build: 15900 | Release Candidate</div>
<div id="en-subtitle"></div>

<div id="entrance">
    <div class="entrance-logo">マジックレストラン Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">-Card Magic Experience-</span></div>
    <button class="start-btn" onclick="igniteMiracle()">奇跡を体験する</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="sub-msg-area">
            <div id="timer">8</div>
            <div id="dynamic-text"></div>
        </div>
        <div id="card-table"></div>
    </div>
    <div id="reserve-ui">
        <div class="btn-group">
            <a href="https://ginzagioia.studio.site/reservation" class="btn">特別な日を予約する</a>
            <button class="btn" style="background:none; border:1px solid #f1d592; color:#f1d592;" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    /**
     * 【マジシャンからの隠しメッセージ】
     * ここまで見るほどこのトリックが気に入って頂き有難う御座います。
     * 私達プロマジシャンもトリックを愛し、大切にしています。
     * 最初の5枚と最後の4枚は似ているトランプですが全て違うトランプです。だから、何を選ばれても消えるのです。
     * 今から100年以上前の「The Art of Magic」という洋書に発表された歴史のあるマジックです。
     * このトリックを愛し大切にしてくださいね。
     * 39aco
     */

    var isStarted = false;
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    const PATTERNS = [
        { A: ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'], B: ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'] },
        { A: ['./10S.webp', './9C.webp', './8D.webp', './9H.webp', './8C.webp'], B: ['./10C.webp', './9S.webp', './8H.webp', './9D.webp'] },
        { A: ['./6H.webp', './5D.webp', './6C.webp', './4S.webp', './5C.webp'], B: ['./6D.webp', './5H.webp', './6S.webp', './4C.webp'] }
    ];

    function getVisitPattern() {
        let count = parseInt(localStorage.getItem('gioia_magic_cycles') || '0');
        localStorage.setItem('gioia_magic_cycles', (count + 1).toString());
        return PATTERNS[count % PATTERNS.length];
    }

    function updateSubtitle(text) {
        const sub = document.getElementById('en-subtitle');
        if (!text) { sub.style.opacity = '0'; return; }
        sub.innerText = text;
        sub.style.opacity = '1';
    }

    // シェアタイトルの修正
    function sharePage() {
        var url = window.location.href.split('?')[0];
        var shareTitle = 'マジックレストランGran GIOIA Ginza -Card Magic Experience-';
        if (navigator.share) { navigator.share({ title: shareTitle, url: url }); }
        else { alert("リンクをコピーしました：\n" + url); }
    }

    async function igniteMiracle() {
        if(isStarted) return;
        isStarted = true;

        var pattern = getVisitPattern(); 
        var gameUI = document.getElementById('game-ui');
        var msgBox = document.getElementById('msg-container');
        var dynamicText = document.getElementById('dynamic-text');
        var timerDisplay = document.getElementById('timer');
        var table = document.getElementById('card-table');
        var wait = ms => new Promise(r => setTimeout(r, ms));

        var pushMsg = (jp, en) => {
            var el = document.createElement('div');
            el.className = 'msg-line bottom';
            el.innerHTML = jp;
            msgBox.appendChild(el);
            updateSubtitle(en);
            void el.offsetWidth;
            var lines = msgBox.querySelectorAll('.msg-line');
            if(lines.length > 2) lines[0].remove();
            lines.forEach((l, i) => {
                if(i === lines.length - 1) setTimeout(() => l.className = 'msg-line center', 50);
                else l.className = 'msg-line top';
            });
        };

        document.getElementById('entrance').style.opacity = '0';
        gameUI.style.display = 'block';
        setTimeout(() => { document.getElementById('entrance').style.display = 'none'; document.getElementById('bg-image').style.opacity = '1'; }, 800);
        
        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。", "We invite you to experience a miracle.");
        await wait(2200);

        var currentA = [...pattern.A].sort(() => Math.random() - 0.5);
        var currentB = [...pattern.B].sort(() => Math.random() - 0.5);
        var cards = [];
        for(var i=0; i<5; i++) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = (i + 1) * 10; 
            c.innerHTML = '<div class="card-inner"><div class="card-face card-front" style="background-image:url(\''+currentA[i]+'\')"></div><div class="card-face card-back"></div></div>';
            table.appendChild(c);
            cards.push(c);
        }
        await wait(100);
        cards.forEach(c => { c.classList.add('is-visible'); });
        await wait(1000);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。", "Please choose one of these five cards in your mind.");
        
        var winW = window.innerWidth;
        var span = (winW < 600) ? winW * 0.15 : 135; 
        var targets = [{ tx: -2 * span, ty: 30, rot: -24 },{ tx: -1 * span, ty: 15, rot: -12 },{ tx: 0, ty: 0, rot: 0 },{ tx: 1 * span, ty: 15, rot: 12 },{ tx: 2 * span, ty: 30, rot: 24 }];

        // リボンスプレッド
        cards.forEach(c => {
            c.style.transform = `translate(${targets[0].tx}px, ${targets[0].ty}px) rotate(${targets[0].rot}deg)`;
        });
        await wait(600);

        for (let i = 0; i < 4; i++) {
            for (let j = i + 1; j < 5; j++) {
                let nextTarget = targets[i + 1];
                cards[j].style.transition = "transform 0.45s cubic-bezier(0.2, 0, 0.2, 1)";
                cards[j].style.transform = `translate(${nextTarget.tx}px, ${nextTarget.ty}px) rotate(${nextTarget.rot}deg)`;
            }
            await wait(280);
        }
        
        cards.forEach((c, i) => {
            let t = targets[i];
            c.style.setProperty('--base-tx', t.tx + "px");
            c.style.setProperty('--base-ty', t.ty + "px");
            c.style.setProperty('--base-rot', t.rot + "deg");
        });
        await wait(600);

        for (let i = 0; i < cards.length; i++) {
            setTimeout(() => {
                cards[i].classList.add('floating');
                cards[i].classList.remove('is-back');
            }, i * 200);
        }
        await wait(2000);

        timerDisplay.style.opacity = "1";
        for (var i = 8; i >= 0; i--) {
            timerDisplay.innerText = i;
            if (i === 6) {
                // セリフと英文のブラッシュアップ（mindへ統一）
                if (isMobile) {
                    dynamicText.innerHTML = "スマートフォンのマイクにも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。";
                    updateSubtitle("Now, silently repeat its suit and number in your mind three times.");
                } else {
                    dynamicText.innerHTML = "誰にも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。";
                    updateSubtitle("Now, silently repeat its suit and number in your mind three times.");
                }
                dynamicText.style.opacity = "1";
            }
            if (i === 0) break;
            await wait(1000);
        }
        timerDisplay.style.opacity = "0";
        dynamicText.style.opacity = "0";
        await wait(500);

        cards.forEach(c => {
            c.className = 'card is-back is-visible';
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translate(0, 0) rotate(0deg)";
        });
        await wait(1500);

        var moveX = (winW < 600) ? winW * 0.42 : 240;
        var shuffleSteps = [{x:moveX, r:14},{x:-moveX, r:-14},{x:moveX, r:12}];
        updateSubtitle("Now Shuffling...");

        for (var j=0; j<shuffleSteps.length; j++) {
            let deck = [...cards].sort((a,b) => parseInt(a.style.zIndex) - parseInt(b.style.zIndex));
            let pull = deck[deck.length - 2]; 
            let step = shuffleSteps[j];
            pull.style.transition = "transform 0.46s cubic-bezier(0.2, 0.8, 0.2, 1)"; 
            pull.style.transform = `translate(${step.x}px, -60px) rotate(${step.r}deg)`;
            await wait(500); 
            let maxZ = Math.max(...cards.map(el => parseInt(el.style.zIndex)));
            pull.style.zIndex = maxZ + 1;
            pull.style.transform = "translate(0, 0) rotate(0deg)";
            await wait(350); 
        }
        await wait(800);

        pushMsg("あなたの頭の中にあるカードはきっとコチラ….", "I believe this is your card…");
        let finalDeck = [...cards].sort((a,b) => parseInt(a.style.zIndex) - parseInt(b.style.zIndex));
        let fSpan = (winW < 600) ? winW * 0.16 : 140;
        finalDeck.forEach((c, i) => {
            let diff = i - 2;
            let tx = diff * fSpan;
            let ty = Math.abs(diff) * 12;
            let rot = diff * 10;
            c.style.zIndex = (i + 1) * 10; 
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
        });
        await wait(1800);

        // --- 究極の「上昇 ➡ 停止 ➡ 消失」シークエンス ---
        var vCard = finalDeck[2]; 
        vCard.classList.remove('floating'); 
        void vCard.offsetWidth; 
        
        // 1. 上昇開始 (3.8s)
        vCard.classList.add('miracle-rise'); 
        await wait(3800); 

        // 2. 頂上で停止 (1.0s)
        await wait(1000); 

        // 3. 消失バースト
        vCard.classList.remove('miracle-rise');
        void vCard.offsetWidth;
        vCard.classList.add('vanish-action');

        await wait(400);
        pushMsg("あなたのカードだけが、消えました。", "Your card should be the only one that has vanished.");
        await wait(1600); 

        var remaining = cards.filter(c => c !== vCard).sort((a, b) => {
            return parseFloat(a.style.getPropertyValue('--base-tx')) - parseFloat(b.style.getPropertyValue('--base-tx'));
        });
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = `url('${currentB[i]}')`);
        await wait(1200);

        for (var k = 0; k < remaining.length; k++) {
            let flipDelay = (k === remaining.length - 1) ? 900 : 500;
            await wait(flipDelay);
            remaining[k].classList.remove('is-back');
            remaining[k].classList.add('floating');
        }
        await wait(2000);

        msgBox.style.opacity = "0";
        dynamicText.style.top = "10px";
        dynamicText.innerHTML = "奇跡を感じましたか？<br>Gran GIOIA Ginzaでは、<br>あなたの眼の前で「奇跡」をお届けします。";
        updateSubtitle("Where miracles come to life before your eyes — Gran GIOIA Ginza.");
        dynamicText.style.opacity = "1";
        dynamicText.style.fontSize = "1.2rem";

        await wait(5500); 
        table.style.opacity = '0';
        updateSubtitle("");
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => { reserveUI.style.opacity = 1; }, 100);
    }
</script>
</body>
</html>
