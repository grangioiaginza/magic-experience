<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gran GIOIA Ginza -Card Magic-</title>
    <style>
        /* 1. 基本レイアウト & 背景 */
        body { background-color: #000; color: #f1d592; font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .container { 
            min-height: 100vh; width: 100vw; position: relative; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5vh; 
            background-image: url('./SocialCover.webp');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        .container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1; }
        
        /* 2. メッセージエリア：PC/スマホ完全中央 */
        #msg-container { height: 160px; width: 100%; position: relative; z-index: 100; }
        .msg-line { 
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); 
            opacity: 0; font-size: 1.4rem; font-weight: normal; line-height: 1.6; letter-spacing: 0.15em; 
            text-shadow: 0 0 20px rgba(0,0,0,1); white-space: nowrap;
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-50px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-100px); }
        .msg-line.bottom { opacity: 0; transform: translateY(50px); }

        /* 3. カウントダウン */
        #timer { 
            height: 100px; width: 100%; font-size: 6rem; font-weight: bold; color: #fff; 
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 500; font-family: serif;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 50px #000;
        }

        /* 4. カードエリア */
        #card-table { height: 350px; position: relative; width: 100%; max-width: 800px; display: flex; justify-content: center; align-items: center; z-index: 10; transition: opacity 1.5s; }
        .card { width: 130px; height: 195px; position: absolute; perspective: 1000px; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.3px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        /* 特殊エフェクト */
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--base-rot)); } 50% { transform: translateY(-12px) rotate(calc(var(--base-rot) + 2deg)); } }
        .floating { animation: float 3.5s infinite ease-in-out; }
        .juwa-in { animation: juwa-in 1.2s forwards; }
        @keyframes juwa-in { from { opacity: 0; filter: blur(20px); transform: scale(0.8); } to { opacity: 1; filter: blur(0); transform: scale(1); } }
        .juwa-out { animation: juwa-out 3.0s forwards; } 
        @keyframes juwa-out { from { opacity: 1; filter: blur(0); transform: scale(1); } to { opacity: 0; filter: blur(45px); transform: scale(1.6); } }

        /* フィナーレ */
        #reserve-ui { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 600; transition: 2s; }
        .btn { background: #f1d592; border: none; padding: 18px 55px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; box-shadow: 0 5px 25px rgba(0,0,0,0.6); }
        .hidden { display: none !important; }
        #version-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: rgba(241,213,146,0.5); z-index: 2000; }
    </style>
</head>
<body>

<div id="orientation-overlay">
    <p>画面を横にして、"Card Magic"をお楽しみください</p>
    <div style="font-size: 3rem; margin-top: 20px;">🔄</div>
</div>

<div id="version-info">Build: 2250</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="timer">8</div>
        <div id="card-table"></div>
    </div>
    <div id="reserve-ui" class="hidden">
        <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
    </div>
</div>

<script>
    const fixedSetA = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
    const fixedSetB = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
    let currentA = [];
    let currentB = [];

    const table = document.getElementById('card-table');
    const timerDisplay = document.getElementById('timer');
    const msgContainer = document.getElementById('msg-container');

    window.onload = () => {
        const isAdmin = new URLSearchParams(window.location.search).get('mode') === 'gioia_admin';
        if (!isAdmin && localStorage.getItem('gioia_magic_played')) {
            showReserveImmediately();
        } else {
            if (isAdmin) localStorage.removeItem('gioia_magic_played');
            setupCards();
            initMagic();
        }
    };

    function setupCards() {
        currentA = shuffle([...fixedSetA]);
        currentB = shuffle([...fixedSetB]);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function pushMsg(text) {
        const lines = msgContainer.querySelectorAll('.msg-line');
        lines.forEach(l => {
            if (l.classList.contains('top')) { l.classList.replace('top', 'exit'); setTimeout(() => l.remove(), 1200); }
            else if (l.classList.contains('center')) { l.classList.replace('center', 'top'); }
        });
        const el = document.createElement('div');
        el.className = 'msg-line bottom';
        el.innerHTML = text;
        msgContainer.appendChild(el);
        el.offsetHeight; 
        setTimeout(() => el.classList.replace('bottom', 'center'), 100);
    }

    // リアルなシャッフル演出（右・左・右）
    async function performShuffle(cards) {
        // 右
        cards[4].style.zIndex = 10;
        cards[4].style.transform = 'translate(80px, -15px) rotate(5deg)';
        await sleep(400);
        cards[4].style.zIndex = 0;
        cards[4].style.transform = 'translate(0, 0) rotate(0deg)';
        await sleep(300);
        // 左
        cards[3].style.zIndex = 10;
        cards[3].style.transform = 'translate(-80px, -15px) rotate(-5deg)';
        await sleep(400);
        cards[3].style.zIndex = 0;
        cards[3].style.transform = 'translate(0, 0) rotate(0deg)';
        await sleep(300);
        // 右
        cards[2].style.zIndex = 10;
        cards[2].style.transform = 'translate(80px, -15px) rotate(5deg)';
        await sleep(400);
        cards[2].style.zIndex = 0;
        cards[2].style.transform = 'translate(0, 0) rotate(0deg)';
        await sleep(400);
    }

    async function initMagic() {
        try {
            await sleep(1000);
            pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
            await sleep(1000);

            // カード生成とフェードイン
            currentA.forEach((img, i) => {
                const card = document.createElement('div');
                card.className = 'card is-back is-visible juwa-in';
                card.style.left = 'calc(50% - 65px)';
                card.style.zIndex = i;
                card.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${img}')"></div><div class="card-face card-back"></div></div>`;
                table.appendChild(card);
            });
            await sleep(1500);

            pushMsg("この五枚の中から、直感で一枚を頭に強く念じてください。");
            const cards = document.querySelectorAll('.card');
            cards.forEach((c, i) => {
                const offset = (i - 2) * 160;
                const rot = (i - 2) * 5;
                c.style.left = `calc(50% - 65px + ${offset}px)`;
                c.style.setProperty('--base-rot', `${rot}deg`);
                c.style.transform = `rotate(${rot}deg)`;
            });
            await sleep(3500);

            pushMsg("スマートフォンのマイクが、<br>あなたの声を拾うかもしれません。");
            await sleep(4500);
            pushMsg("声に出さずあなたの頭の中だけで、<br>一枚のマークと数字をしっかりと念じてください。");
            await sleep(4500);

            for (let c of cards) { c.classList.remove('is-back'); c.classList.add('floating'); await sleep(250); }

            timerDisplay.style.opacity = 1;
            for (let i = 8; i >= 0; i--) { timerDisplay.innerText = i; if (i === 0) break; await sleep(900); }
            timerDisplay.style.opacity = 0;

            // 集合
            cards.forEach(c => {
                c.classList.add('is-back');
                c.classList.remove('floating');
                c.style.left = 'calc(50% - 65px)';
                c.style.transform = 'rotate(0deg)';
            });
            await sleep(1200);

            // シャッフル演出
            await performShuffle(cards);
            await sleep(800);

            pushMsg("あなたの頭の中にあるカードを消してみせます...");
            await sleep(1000);

            // 消失する1枚（真ん中）の上昇と黄金の光
            const vanishCard = cards[2];
            vanishCard.style.zIndex = 100;
            vanishCard.style.boxShadow = '0 0 50px 15px #f1d592';
            vanishCard.style.transition = "top 3.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 1s, opacity 1s";
            vanishCard.style.top = '-150px';
            await sleep(4000);

            vanishCard.classList.add('juwa-out');
            await sleep(3000);

            pushMsg("あなたのカードだけが、消えました。");
            // 残りの4枚をその場で開示
            let revealCount = 0;
            for (let i = 0; i < cards.length; i++) {
                if (i === 2) continue;
                await sleep(revealCount === 3 ? 2500 : 800);
                cards[i].classList.remove('is-back');
                cards[i].classList.add('floating');
                revealCount++;
            }

            await sleep(3500);
            pushMsg("不思議を感じましたか？");
            await sleep(3000);
            pushMsg("Gran GIOIA Ginzaでは、");
            await sleep(3000);
            pushMsg("WEBでは決して体験できない");
            await sleep(3000);
            pushMsg("「このレベルではない奇跡」をお届けします。");

            await sleep(4500);
            table.style.opacity = 0;
            await sleep(1500);

            document.getElementById('reserve-ui').classList.remove('hidden');
            setTimeout(() => document.getElementById('reserve-ui').style.opacity = 1, 100);
        } catch (e) {
            document.getElementById('version-info').innerText = "Error: " + e.message;
        }
    }

    function showReserveImmediately() {
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('reserve-ui').classList.remove('hidden');
        document.getElementById('reserve-ui').style.opacity = 1;
    }
</script>
</body>
</html>
