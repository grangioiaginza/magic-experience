<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        /* 1. ブラックアウトを物理的に防ぐ堅牢レイアウト */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050505; color: #f1d592; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; overflow: hidden; }
        
        /* 背景と暗転を統合し、リソースの競合を防止 */
        .container { 
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('./SocialCover.webp') center/cover no-repeat;
            position: relative; z-index: 1;
        }
        #game-ui { width: 100%; z-index: 10; margin-top: 5vh; position: relative; }

        /* 2. メッセージ中央配置 */
        #msg-container { height: 160px; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .msg-line { 
            position: absolute; width: 100%; display: flex; align-items: center; justify-content: center;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px #000; white-space: nowrap;
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(60px); }

        /* 3. カードテーブル */
        #card-table { height: 420px; width: 100%; max-width: 900px; position: relative; display: flex; justify-content: center; align-items: center; }
        .card { width: 130px; height: 195px; position: absolute; perspective: 1200px; opacity: 0; pointer-events: none; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146
