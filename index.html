<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        :root {
            --card-w: 130px;
            --card-h: 195px;
            --accent: #f1d592;
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: var(--accent); font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); z-index: 1; }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 2; }
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        /* エントランス */
        #entrance { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); transition: opacity 0.8s ease; }
        .entrance-logo { font-size: 1.8rem; letter-spacing: 0.3em; margin-bottom: 50px; text-align: center; text-shadow: 0 0 20px #000; }
        .start-btn { background: var(--accent); color: #000; border: none; padding: 22px 65px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 0.2em; min-width: 280px; box-shadow: 0 0 30px rgba(241,213,146,0.3); }
        .start-btn:hover { transform: scale(1.05); background: #fff; }

        /* メッセージ */
        #game-ui { width: 100%; margin-top: 5vh; display: none; opacity: 0; transition: opacity 1s; }
        #msg-container { height: 180px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .msg-line { position: absolute; width: 100%; display: flex; align-items: center; justify-content: center; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px #000; white-space: nowrap; line-height: 1.6; }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(60px); }
        
        #finale-text { position: absolute; width: 100%; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 2s; text-align: center; font-size: 1.5rem; line-height: 2.2; letter-spacing: 0.15em; z-index: 50; pointer-events: none; }

        /* カード */
        #card-table { height: 420px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
        .card { width: var(--card-w); height: var(--card-h); position: absolute; left: 50%; margin-left: calc(var(--card-w) / -2); perspective: 1200px; opacity: 0; pointer-events: none; transform: translate(0, 400px) scale(0.5); }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        @keyframes magicFloat { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 18px)) rotate(calc(var(--base-rot) + 1.8deg)); } 
        }
        .floating { animation: magicFloat 3.5s infinite ease-in-out !important; }
        
        /* 劇的消失アニメーション */
        @keyframes luminousEvaporation {
            0% { filter: drop-shadow(0 0 0px transparent) brightness(1) blur(0px); transform: translate(var(--base-tx), -280px) rotate(5deg) scale(1); opacity: 1; }
            30% { filter: drop-shadow(0 0 50px #fff) brightness(15) blur(5px); transform: translate(var(--base-tx), -290px) rotate(7deg) scale(1.1); opacity: 1; }
            100% { filter: drop-shadow(0 0 120px var(--accent)) brightness(5) blur(40px); transform: translate(var(--base-tx), -320px) rotate(10deg) scale(1.5); opacity: 0; }
        }
        .vanish-action { animation: luminousEvaporation 1.8s forwards cubic-bezier(0.4, 0, 0.2, 1) !important; }
        .glow { box-shadow: 0 0 60px 20px var(--accent) !important; transition: box-shadow 2.5s; }
        
        #timer { height: 100px; font-size: 6rem; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; text-shadow: 0 0 50px #000; }
        
        /* 最終UI */
        #reserve-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2s; }
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .btn { background: var(--accent); border: none; padding: 20px 60px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .btn.secondary { background: none; border: 1px solid var(--accent); color: var(--accent); }

        #status-info { position: fixed; bottom: 12px; right: 12px; font-size: 10px; color: var(--accent); z-index: 10001; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid var(--accent); opacity: 0.5; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-curtain"></div>
<div id="status-info">Build: 13800 | Professional Manipulator</div>

<div id="entrance">
    <div class="entrance-logo">Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">Card Magic Experience</span></div>
    <button class="start-btn" onclick="igniteMiracle()">奇跡の扉を開く</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="timer">8</div>
        <div id="card-table">
            <div id="finale-text">
                不思議を感じましたか？<br>
                Gran GIOIA Ginzaでは、<br>
                「このレベルではない奇跡」をお届けします。
            </div>
        </div>
    </div>
    <div id="reserve-ui">
        <div class="btn-group">
            <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
            <button class="btn secondary" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    /*
        マジシャンからのメッセージ：
        ここまで見るほどこのトリックが気に入って頂き有難う御座います。
        私達プロマジシャンもトリックを愛し、大切にしています。
        もうお分かりかもしれませんが、最初の5枚と最後の4枚は似ているトランプですが全て違うトランプです。
        なので、最初の5枚のどれを選ばれても消えてしまうんです。
        今から100年以上前の「The Art of Magic」という洋書に発表された歴史のあるマジックです。
        このトリックを愛し大切にしてくださいね。
    */

    var isRunning = false;
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    function sharePage() {
        var url = window.location.href.split('?')[0];
        if (navigator.share) { navigator.share({ title: 'Gran GIOIA Ginza', url: url }); }
        else { alert("リンクをコピーしました：\n" + url); }
    }

    async function igniteMiracle() {
        if(isRunning) return;
        isRunning = true;

        var entrance = document.getElementById('entrance');
        var gameUI = document.getElementById('game-ui');
        var msgBox = document.getElementById('msg-container');
        var table = document.getElementById('card-table');
        var timer = document.getElementById('timer');

        var pushMsg = function(txt) {
            var el = document.createElement('div');
            el.className = 'msg-line bottom';
            el.innerHTML = txt;
            msgBox.appendChild(el);
            void el.offsetWidth;
            var lines = msgBox.querySelectorAll('.msg-line');
            if(lines.length > 3) lines[0].remove();
            lines.forEach((l, i) => {
                if(i === lines.length - 1) setTimeout(() => l.className = 'msg-line center', 50);
                else if(i === lines.length - 2) l.className = 'msg-line top';
                else l.className = 'msg-line exit';
            });
        };

        // 扉を開く
        entrance.style.opacity = '0';
        gameUI.style.display = 'block';
        setTimeout(() => { entrance.style.display = 'none'; gameUI.style.opacity = '1'; }, 800);

        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");

        // --- 1. 真のディール（配札） ---
        var SET_A = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
        var SET_B = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
        var currentA = [...SET_A].sort(() => Math.random() - 0.5);
        var currentB = [...SET_B].sort(() => Math.random() - 0.5);

        var cards = [];
        for(var i=0; i<5; i++) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = i;
            c.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${currentA[i]}')"></div><div class="card-face card-back"></div></div>`;
            table.appendChild(c);
            cards.push(c);
        }
        await wait(200);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。");
        // 1枚ずつ定位置へディール
        for(var i=0; i<cards.length; i++) {
            var c = cards[i];
            var diff = i - (cards.length - 1) / 2;
            var tx = diff * 165;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * 12;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            
            c.style.transition = "transform 0.8s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.5s";
            c.classList.add('is-visible');
            c.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
            await wait(350); // ディールの間
        }
        await wait(600);

        // 表向き & フワフワ
        cards.forEach((c, i) => {
            setTimeout(() => { 
                c.classList.remove('is-back'); 
                c.classList.add('floating');
            }, i * 150);
        });
        await wait(1500);

        // --- 2. カウントダウン（割り込みメッセージ） ---
        timer.style.opacity = 1;
        for (var i = 8; i >= 0; i--) {
            timer.innerText = i;
            if (i === 6) {
                pushMsg("スマートフォンのマイクにも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。");
            }
            if (i === 0) break;
            await wait(1000);
        }
        timer.style.opacity = 0;

        // --- 3. 集合と【絶対不動】シャッフル ---
        cards.forEach(c => {
            c.className = 'card is-back is-visible';
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translate(0, 0) rotate(0deg)";
        });
        await wait(1500);

        // アンカー（一番上 zIndex:4）を物理固定
        var deck = [...cards].sort((a,b) => a.style.zIndex - b.style.zIndex);
        var anchorCard = deck[4];
        anchorCard.style.zIndex = 5000; // 圧倒的最前面

        var pulls = [
            { target: deck[3], x: 330, rot: 22 }, 
            { target: deck[0], x: -330, rot: -22 }, 
            { target: deck[1], x: 260, rot: 15 }
        ];
        var topZ = 1000;

        for (var p of pulls) {
            p.target.style.zIndex = 500; // アンカーの下を潜らせる
            p.target.style.transition = "transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1)";
            p.target.style.transform = `translate(${p.x}px, -85px) rotate(${p.rot}deg)`;
            await wait(750);
            p.target.style.transform = "translate(0, 0) rotate(0deg)";
            await wait(450);
            p.target.style.zIndex = topZ++; // 抜き終わったらアンカーのすぐ下に重ねる
        }
        await wait(1000);

        // --- 4. 劇的消失演出（エバポレーション） ---
        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        var finalDeck = [...cards].sort((a,b) => a.style.zIndex - b.style.zIndex);
        finalDeck.forEach((c, i) => {
            var diff = i - (finalDeck.length - 1) / 2;
            var tx = diff * 145;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * 10;
            c.style.zIndex = i;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
        });
        await wait(1800);

        var vCard = finalDeck[2];
        vCard.classList.add('glow');
        await wait(800);

        // 上昇 (2.8s)
        var vTx = vCard.style.getPropertyValue('--base-tx');
        vCard.style.transition = "transform 2.8s cubic-bezier(0.4, 0, 0.2, 1)";
        vCard.style.transform = `translate(${vTx}, -280px) rotate(5deg)`;
        await wait(2800);

        // 頂上での蒸発バースト
        vCard.style.transition = "none";
        vCard.classList.remove('glow', 'floating');
        void vCard.offsetWidth;
        vCard.classList.add('vanish-action');

        await wait(500);
        pushMsg("あなたのカードだけが、消えました。");
        await wait(1300);

        // --- 5. フィナーレ ---
        var remaining = cards.filter(c => c !== vCard);
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = `url('${currentB[i]}')`);
        await wait(1000);

        for (var k = 0; k < remaining.length; k++) {
            await wait(k === remaining.length - 1 ? 850 : 450);
            remaining[k].classList.remove('is-back');
            remaining[k].classList.add('floating');
        }
        await wait(2500);

        // テキストフェード
        msgBox.style.opacity = "0";
        var finaleText = document.getElementById('finale-text');
        finaleText.style.opacity = "1";
        
        await wait(4500);
        
        // カードを消してボタンを出す（クロスフェード）
        table.style.transition = "opacity 2s";
        table.style.opacity = "0";
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => { reserveUI.style.opacity = 1; }, 100);
    }
</script>
</body>
</html>
