<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gran GIOIA Ginza - Digital Magic</title>
    <style>
        body { background-color: #000; color: #f1d592; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2a2a2a 0%, #000 100%); }
        
        /* 横画面推奨案内 */
        #orientation-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
            visibility: hidden; opacity: 0; transition: 0.5s;
        }
        @media screen and (orientation: portrait) { #orientation-overlay { visibility: visible; opacity: 1; } }

        /* メッセージコンテナ（2行表示を美しく） */
        #msg-container { height: 180px; position: relative; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 100; overflow: visible; }
        .msg-line { position: absolute; width: 90%; left: 5%; transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.3rem; font-weight: normal; line-height: 1.6; letter-spacing: 0.1em; text-shadow: 0 0 15px rgba(0,0,0,1); }
        
        /* セリフの動き：下から中央へ、中央から上へ、上から消える */
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.4; transform: translateY(-50px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-100px); }
        .msg-line.bottom { opacity: 0; transform: translateY(50px); }

        #card-table { display: flex; justify-content: center; align-items: center; height: 320px; position: relative; width: 100%; max-width: 800px; margin-top: -20px; }
        
        .card { width: 130px; height: 195px; position: absolute; perspective: 1000px; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 0; filter: blur(10px); }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s ease-in-out; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; filter: blur(0); }

        /* スタック時の影抑制（オーナー様のご要望） */
        .card.stacked { box-shadow: none !important; }
        .card.stacked .card-face { box-shadow: 0 2px 8px rgba(0,0,0,0.6) !important; }

        /* 消失と出現 */
        .juwa-in { animation: juwa-in 1.5s forwards; }
        .juwa-out { animation: juwa-out 1.5s forwards; }
        @keyframes juwa-in { from { opacity: 0; filter: blur(20px); transform: scale(0.8); } to { opacity: 1; filter: blur(0); transform: scale(1); } }
        @keyframes juwa-out { from { opacity: 1; filter: blur(0); transform: scale(1); } to { opacity: 0; filter: blur(30px); transform: scale(1.4); } }

        /* 浮遊 */
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--base-rot)); } 50% { transform: translateY(-12px) rotate(calc(var(--base-rot) + 2deg)); } }
        .floating { animation: float 3.5s infinite ease-in-out; }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.3px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        /* タイマー視認性：縁取りと影を最強に */
        #timer { 
            font-size: 7rem; font-weight: bold; color: #fff; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            opacity: 0; pointer-events: none; z-index: 500; font-family: 'Times New Roman', serif;
            text-shadow: 
                3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 
                0 0 40px rgba(0,0,0,1), 0 0 70px rgba(0,0,0,1);
        }
        
        #version-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: rgba(241,213,146,0.5); font-family: sans-serif; z-index: 2000; }
        .hidden { display: none !important; }
        #reserve-ui { padding: 40px; transition: 2s; opacity: 0; }
        .btn { background: #f1d592; border: none; padding: 15px 45px; border-radius: 40px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.1rem; margin-top: 20px; }
    </style>
</head>
<body>

<div id="orientation-overlay">
    <p>画面を横にして、"奇跡"をお楽しみください</p>
    <div style="font-size: 3rem; margin-top: 20px;">🔄</div>
</div>

<div id="version-info"></div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="card-table"><div id="timer">8</div></div>
    </div>

    <div id="reserve-ui" class="hidden">
        <h1>不思議を感じましたか？</h1>
        <p style="line-height: 2.2;">Gran GIOIA Ginza では、<br>WEBでは決して体験できない<br>「このレベルではない軌跡」をお届けします。</p>
        <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
    </div>
</div>

<script>
    const cardsSetA = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
    const cardsSetB = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
    const table = document.getElementById('card-table');
    const msgContainer = document.getElementById('msg-container');

    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('mode') === 'gioia_admin';

    window.onload = () => {
        const now = new Date();
        document.getElementById('version-info').innerText = "Script Build: " + now.toLocaleTimeString();

        if (!isAdmin && localStorage.getItem('gioia_magic_played')) {
            showReserve();
        } else {
            if (isAdmin) localStorage.removeItem('gioia_magic_played');
            initMagic();
        }
    };

    async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // 【修正版】メッセージのせり上がり制御
    function pushMsg(newText) {
        const currentLines = msgContainer.querySelectorAll('.msg-line');
        currentLines.forEach(line => {
            if (line.classList.contains('top')) {
                line.classList.replace('top', 'exit');
                setTimeout(() => line.remove(), 1200);
            } else if (line.classList.contains('center')) {
                line.classList.replace('center', 'top');
            }
        });

        const newLine = document.createElement('div');
        newLine.className = 'msg-line bottom';
        newLine.innerHTML = newText;
        msgContainer.appendChild(newLine);

        // 強制的にブラウザに描画を認識させる
        newLine.offsetHeight; 
        
        // 中央へ移動
        setTimeout(() => {
            newLine.classList.replace('bottom', 'center');
        }, 50);
    }

    async function initMagic() {
        table.innerHTML = '<div id="timer">8</div>';
        const t = document.getElementById('timer');
        
        await sleep(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
        await sleep(2500);

        // 1. 中央スタック（影抑制）でジュワッと登場
        cardsSetA.forEach((img, i) => {
            const card = document.createElement('div');
            card.className = 'card is-back juwa-in stacked';
            card.style.left = `calc(50% - 65px)`;
            card.style.zIndex = i;
            card.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${img}')"></div><div class="card-face card-back"></div></div>`;
            table.appendChild(card);
        });

        await sleep(2000);
        pushMsg("この五枚の中から、直感で一枚を頭に強く念じてください。");
        
        // 2. ディーラー配り
        await sleep(3000);
        const cards = document.querySelectorAll('.card');
        cards.forEach((c, i) => {
            const offset = (i - 2) * 155;
            const rot = (i - 2) * 5;
            c.classList.remove('juwa-in', 'stacked');
            c.classList.add('is-visible');
            c.style.left = `calc(50% - 65px + ${offset}px)`;
            c.style.setProperty('--base-rot', `${rot}deg`);
            c.style.transform = `rotate(${rot}deg)`;
        });

        await sleep(2500);
        pushMsg("スマートフォンのマイクが、<br>あなたの思考を拾うかもしれません。");
        await sleep(4500);
        pushMsg("声に出さずあなたの頭の中だけで、<br>一枚のマークと数字をしっかりと念じてください。");
        await sleep(4500);

        // 3. 表向きにする + 揺れ開始
        for (let c of cards) {
            c.classList.remove('is-back');
            c.classList.add('floating');
            await sleep(250);
        }

        // 4. カウントダウン
        t.style.opacity = 1;
        for (let i = 8; i >= 0; i--) {
            t.innerText = i;
            if (i === 0) break;
            await sleep(900);
        }

        // 5. 強制裏返し + 一度スタック（影抑制）
        t.style.opacity = 0;
        cards.forEach(c => {
            c.classList.add('is-back', 'stacked');
            c.classList.remove('floating');
            c.style.left = `calc(50% - 65px)`;
            c.style.transform = `rotate(0deg)`;
        });

        await sleep(1800);
        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        
        // 6. 再びファン（扇状）にする
        await sleep(1200);
        cards.forEach((c, i) => {
            const offset = (i - 2) * 125;
            const rot = (i - 2) * 4;
            c.classList.remove('stacked');
            c.style.left = `calc(50% - 65px + ${offset}px)`;
            c.style.transform = `rotate(${rot}deg)`;
        });

        // 7. 真ん中の1枚がスルスルとせり出す
        await sleep(1500);
        const vanishCard = cards[2]; 
        vanishCard.style.zIndex = 300;
        vanishCard.style.top = `-140px`; 
        await sleep(1800);

        // 8. ジュワッと消失
        vanishCard.classList.add('juwa-out');
        await sleep(2000);

        // 9. SetB展開
        pushMsg("あなたのカードだけが、消えました。");
        table.innerHTML = '';
        cardsSetB.forEach((img, i) => {
            const card = document.createElement('div');
            card.className = 'card is-back is-visible';
            const offset = (i - 1.5) * 155;
            const rot = (i - 1.5) * 5;
            card.style.left = `calc(50% - 65px + ${offset}px)`;
            card.style.setProperty('--base-rot', `${rot}deg`);
            card.style.transform = `rotate(${rot}deg)`;
            card.innerHTML = `<div class="card-inner"><div class="card-face card-front" style="background-image:url('${img}')"></div><div class="card-face card-back"></div></div>`;
            table.appendChild(card);
        });

        // 10. 1枚ずつ表になり、浮遊
        await sleep(1500);
        const finalCards = document.querySelectorAll('.card');
        for (let c of finalCards) {
            c.classList.remove('is-back');
            c.classList.add('floating');
            await sleep(650);
        }

        if (!isAdmin) localStorage.setItem('gioia_magic_played', 'true');
        await sleep(5500);
        showReserve();
    }

    function showReserve() {
        document.getElementById('game-ui').style.opacity = 0;
        setTimeout(() => {
            document.getElementById('game-ui').classList.add('hidden');
            const res = document.getElementById('reserve-ui');
            res.classList.remove('hidden');
            setTimeout(() => res.style.opacity = 1, 100);
        }, 1200);
    }
</script>
</body>
</html>
