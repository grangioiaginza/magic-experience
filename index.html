<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza</title>
    <style>
        /* --- 基礎レイアウト：ブラックアウト対策 --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #f1d592; font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); z-index: 1; 
        }
        #bg-image { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('./SocialCover.webp') center/cover no-repeat; z-index: 2; opacity: 0; transition: opacity 2s; 
        }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 3; }
        
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        /* エントランス：絶対表示 */
        #entrance { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); opacity: 1; 
        }
        .entrance-logo { font-size: 1.8rem; letter-spacing: 0.3em; margin-bottom: 50px; text-align: center; text-shadow: 0 0 20px #000; }
        .start-btn { 
            background: #f1d592; color: #000; border: none; padding: 22px 65px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; letter-spacing: 0.2em; min-width: 280px; box-shadow: 0 0 30px rgba(241,213,146,0.5);
        }

        /* ゲームUI */
        #game-ui { width: 100%; margin-top: 5vh; display: none; opacity: 1; }
        #msg-container { height: 180px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .msg-line { 
            position: absolute; width: 100%; display: flex; align-items: center; justify-content: center; 
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px #000; white-space: nowrap; line-height: 1.6; 
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(60px); }
        .msg-line.finale-block { position: relative; opacity: 1; transform: none; display: flex; flex-direction: column; gap: 12px; transition: opacity 2s; width: 100%; margin-top: 20px; }

        /* カード配置 */
        #card-table { height: 420px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
        .card { 
            width: 130px; height: 195px; position: absolute; left: 50%; margin-left: -65px; 
            perspective: 1200px; opacity: 0; pointer-events: none; transform: translate(0, 0); 
        }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        @keyframes magicFloat { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 18px)) rotate(calc(var(--base-rot) + 1.8deg)); } 
        }
        .floating { animation: magicFloat 3.5s infinite ease-in-out !important; }
        .glow { box-shadow: 0 0 60px 20px #f1d592 !important; transition: box-shadow 2.5s; }
        #timer { height: 100px; font-size: 6rem; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; text-shadow: 0 0 50px #000; }
        
        #reserve-ui { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2.5s; }
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .btn { background: #f1d592; border: none; padding: 20px 60px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .btn.secondary { background: none; border: 1px solid #f1d592; color: #f1d592; }

        #status-info { position: fixed; bottom: 12px; right: 12px; font-size: 10px; color: #f1d592; z-index: 10001; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #f1d592; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-image"></div>
<div id="bg-curtain"></div>
<div id="status-info">Build: 9500 | Final Magic Ready</div>

<div id="entrance">
    <div class="entrance-logo">Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">Card Magic Experience</span></div>
    <button class="start-btn" onclick="igniteMiracle()">奇跡の扉を開く</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="timer">8</div>
        <div id="card-table"></div>
    </div>
    <div id="reserve-ui">
        <div class="btn-group">
            <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
            <button class="btn secondary" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    /*
     * MASTER TRICK LOGIC:
     * 最初の5枚と最後の4枚は、実はすべて違うトランプです。
     * この「プリンセス・カードトリック」を愛し、大切にしてください。
     */
    var isStarted = false;
    function sharePage() {
        var url = window.location.href.split('?')[0];
        if (navigator.share) navigator.share({ title: 'Gran GIOIA Ginza', url: url });
        else alert("リンクをコピーしました：\n" + url);
    }

    async function igniteMiracle() {
        if(isStarted) return;
        isStarted = true;

        var entrance = document.getElementById('entrance');
        var gameUI = document.getElementById('game-ui');
        var status = document.getElementById('status-info');
        var msgBox = document.getElementById('msg-container');
        var table = document.getElementById('card-table');
        var timer = document.getElementById('timer');
        var wait = ms => new Promise(r => setTimeout(r, ms));

        var pushMsg = (txt, isFinale = false) => {
            var el = document.createElement('div');
            el.className = isFinale ? 'msg-line finale-block' : 'msg-line bottom';
            el.innerHTML = txt;
            msgBox.appendChild(el);
            void el.offsetWidth;
            if(isFinale) return;
            var lines = msgBox.querySelectorAll('.msg-line:not(.finale-block)');
            if(lines.length > 3) lines[0].remove();
            lines.forEach((l, i) => {
                if(i === lines.length - 1) setTimeout(() => l.className = 'msg-line center', 50);
                else if(i === lines.length - 2) l.className = 'msg-line top';
                else l.className = 'msg-line exit';
            });
        };

        // 遷移開始
        entrance.style.transition = "opacity 0.8s ease";
        entrance.style.opacity = '0';
        gameUI.style.display = 'block';
        setTimeout(() => { entrance.style.display = 'none'; document.getElementById('bg-image').style.opacity = '1'; }, 800);
        
        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");

        // --- 1. 山札からのディール演出 ---
        var SET_A = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
        var SET_B = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
        var currentA = [...SET_A].sort(() => Math.random() - 0.5);
        var currentB = [...SET_B].sort(() => Math.random() - 0.5);

        var cards = [];
        for(var i=0; i<5; i++) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = i;
            c.innerHTML = '<div class="card-inner"><div class="card-face card-front" style="background-image:url(\''+currentA[i]+'\')"></div><div class="card-face card-back"></div></div>';
            table.appendChild(c);
            cards.push(c);
        }
        await wait(500);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。");
        // 山札からシュッ、シュッと配る
        for(var i=0; i<cards.length; i++) {
            var c = cards[i];
            var diff = i - (cards.length - 1) / 2;
            var tx = diff * 165;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * 12;
            
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transition = "transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s";
            
            (function(el, x, y, r, d) {
                setTimeout(() => {
                    el.classList.add('is-visible');
                    el.style.transform = "translate("+x+"px, "+y+"px) rotate("+r+"deg)";
                }, d);
            })(c, tx, ty, rot, i * 450);
        }
        await wait(2800);

        // 反転 & フワフワ
        cards.forEach((c, i) => {
            c.classList.add('floating');
            setTimeout(() => { c.classList.remove('is-back'); }, i * 150);
        });
        await wait(2000);

        // --- 2. カウントダウン ---
        timer.style.opacity = 1;
        for (var i = 8; i >= 0; i--) {
            timer.innerText = i;
            if (i === 6) {
                pushMsg("スマートフォンのマイクにも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。");
            }
            if (i === 0) break;
            await wait(1000);
        }
        timer.style.opacity = 0;

        // --- 3. 集合と【完全不動アンカー】シャッフル ---
        cards.forEach(c => {
            c.className = 'card is-back is-visible';
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translate(0, 0) rotate(0deg)";
        });
        await wait(1500);

        // シャッフル・ロジック
        var getDeck = () => [...cards].sort((a,b) => a.style.zIndex - b.style.zIndex);
        var shuffleSteps = [{x:340,r:22},{x:-340,r:-22},{x:300,r:18}];

        for (var j=0; j<shuffleSteps.length; j++) {
            var deck = getDeck();
            var anchor = deck[4]; // 物理的一番上（これを一切動かさない）
            var pull = deck[3];   // そのすぐ下を抜く
            var step = shuffleSteps[j];

            // 抜く
            pull.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
            pull.style.transform = "translate("+step.x+"px, -65px) rotate("+step.r+"deg)";
            await wait(650);

            // 重ねる
            var maxZ = Math.max(...cards.map(el => parseInt(el.style.zIndex)));
            pull.style.zIndex = maxZ + 1;
            pull.style.transform = "translate(0, 0) rotate(0deg)";
            await wait(450);
        }
        await wait(1000);

        // --- 4. 消失とフィナーレ ---
        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        var finalDeck = getDeck();
        finalDeck.forEach((c, i) => {
            var diff = i - (finalDeck.length - 1) / 2;
            var tx = diff * 145;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * 10;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = "translate("+tx+"px, "+ty+"px) rotate("+rot+"deg)";
        });
        await wait(1800);

        var vCard = finalDeck[2]; 
        vCard.className = 'card is-back is-visible';
        vCard.style.zIndex = 500;
        vCard.querySelector('.card-back').classList.add('glow');
        await wait(1500);

        var vTx = vCard.style.getPropertyValue('--base-tx');
        vCard.style.transition = "transform 4s ease-in-out, opacity 2.5s, filter 2s";
        vCard.style.transform = "translate("+vTx+", -185px) rotate(3deg)"; 
        await wait(3500);
        vCard.style.opacity = '0'; vCard.style.filter = 'blur(30px)';
        await wait(1000);

        pushMsg("あなたのカードだけが、消えました。");
        var remaining = cards.filter(c => c !== vCard);
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = "url('"+currentB[i]+"')");
        await wait(1200);

        for (var k = 0; k < remaining.length; k++) {
            await wait(k === 3 ? 750 : 450);
            remaining[k].classList.remove('is-back');
            remaining[k].classList.add('floating');
        }
        await wait(2500);

        var oldLines = msgBox.querySelectorAll('.msg-line:not(.finale-block)');
        oldLines.forEach(l => l.style.opacity = '0');
        await wait(500);

        pushMsg("不思議を感じましたか？<br>Gran GIOIA Ginzaでは、<br>「このレベルではない奇跡」をお届けします。", true);

        await wait(5500);
        table.style.opacity = '0';
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => { reserveUI.style.opacity = 1; status.style.opacity = 0; }, 100);
    }
</script>
</body>
</html>
