<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        /* --- 基礎レイアウト --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #f1d592; font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); z-index: 1; }
        #bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('./SocialCover.webp') center/cover no-repeat; z-index: 2; opacity: 0; transition: opacity 2s; }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 3; }
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        /* エントランス */
        #entrance { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
        .entrance-logo { font-size: 1.8rem; letter-spacing: 0.3em; margin-bottom: 50px; text-align: center; text-shadow: 0 0 20px #000; }
        .start-btn { background: #f1d592; color: #000; border: none; padding: 22px 65px; font-size: 1.2rem; font-weight: bold; cursor: pointer; letter-spacing: 0.2em; min-width: 280px; box-shadow: 0 0 30px rgba(241,213,146,0.5); transition: 0.3s; }
        .start-btn:hover { background: #fff; transform: scale(1.05); }

        /* ナレーションエリア */
        #game-ui { width: 100%; margin-top: 4vh; display: none; }
        #msg-container { height: 120px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .msg-line { position: absolute; width: 100%; display: flex; align-items: center; justify-content: center; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px #000; white-space: nowrap; }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-40px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-80px); }

        /* 空間演出エリア */
        #sub-msg-area { height: 160px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        #timer { font-size: 6rem; font-weight: bold; color: #fff; opacity: 0; text-shadow: 0 0 50px #000; transition: opacity 0.5s; height: 100px; line-height: 1; }
        #dynamic-text { opacity: 0; transition: opacity 1.5s ease; font-size: 1.3rem; letter-spacing: 0.1em; color: #f1d592; text-align: center; line-height: 1.8; text-shadow: 0 0 25px #000; margin-top: 10px; }

        /* カード配置 */
        #card-table { height: 420px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; transition: opacity 2s ease; }
        .card { width: 130px; height: 195px; position: absolute; left: 50%; margin-left: -65px; perspective: 1200px; opacity: 0; pointer-events: none; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        @keyframes magicFloat { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 18px)) rotate(calc(var(--base-rot) + 1.8deg)); } 
        }
        .floating { animation: magicFloat 3.5s infinite ease-in-out !important; }
        .glow { box-shadow: 0 0 60px 20px #f1d592 !important; transition: box-shadow 2.5s; }
        
        /* 最終アクション */
        #reserve-ui { position: absolute; top: 68%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2s ease; }
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .btn { background: #f1d592; border: none; padding: 20px 60px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.05); }
        .btn.secondary { background: none; border: 1px solid #f1d592; color: #f1d592; }

        #status-info { position: fixed; bottom: 12px; right: 12px; font-size: 10px; color: #f1d592; z-index: 10001; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #f1d592; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-image"></div>
<div id="bg-curtain"></div>
<div id="status-info">Build: 10300 | Multi-Pattern Engine</div>

<div id="entrance">
    <div class="entrance-logo">マジックレストラン Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">-Card Magic Experience-</span></div>
    <button class="start-btn" onclick="igniteMiracle()">奇跡の扉を開く</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="sub-msg-area">
            <div id="timer">8</div>
            <div id="dynamic-text"></div>
        </div>
        <div id="card-table"></div>
    </div>
    <div id="reserve-ui">
        <div class="btn-group">
            <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
            <button class="btn secondary" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    /*
     * 「ここまで見るほどこのトリックが気に入って頂き有難う御座います。
     * 私達プロマジシャンもトリックを愛し、大切にしています。
     * もうお分かりかもしれませんが、最初の5枚と最後の4枚は似ているトランプですが全て違うトランプです。
     * なので、最初の5枚のどれを選ばれても消えてしまうんです。
     * 今から100年以上前の「The Art of Magic」という洋書に発表された歴史のあるマジックです。
     * 昔の人は本当にすごいことを考えましたね。このトリックを愛し大切にしてくださいね」
     */
    var isStarted = false;
    
    // --- カードセット管理ロジック ---
    const PATTERNS = [
        {
            A: ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'],
            B: ['./JS.webp', './JD.webp', './QC.webp', './QH.webp']
        },
        {
            A: ['./10S.webp', './9C.webp', './8D.webp', './9H.webp', './8C.webp'],
            B: ['./10C.webp', './9S.webp', './8H.webp', './9D.webp']
        }
    ];

    function getVisitPattern() {
        // localStorageから訪問回数を取得
        let visits = parseInt(localStorage.getItem('gioia_magic_visits') || '0');
        visits++;
        localStorage.setItem('gioia_magic_visits', visits.toString());
        
        // 奇数回ならパターン0 (J/Q/K)、偶数回ならパターン1 (8/9/10)
        return PATTERNS[(visits - 1) % 2];
    }

    function sharePage() {
        var url = window.location.href.split('?')[0];
        var shareTitle = 'マジックレストラン Gran GIOIA Ginza -Card Magic Experience-';
        if (navigator.share) {
            navigator.share({ title: shareTitle, url: url });
        } else {
            alert("リンクをコピーしました：\n" + url);
        }
    }

    async function igniteMiracle() {
        if(isStarted) return;
        isStarted = true;

        var currentPattern = getVisitPattern(); // 回数に応じたパターンを取得

        var entrance = document.getElementById('entrance');
        var gameUI = document.getElementById('game-ui');
        var msgBox = document.getElementById('msg-container');
        var dynamicText = document.getElementById('dynamic-text');
        var timerDisplay = document.getElementById('timer');
        var table = document.getElementById('card-table');
        var wait = ms => new Promise(r => setTimeout(r, ms));

        var pushMsg = (txt) => {
            var el = document.createElement('div');
            el.className = 'msg-line bottom';
            el.innerHTML = txt;
            msgBox.appendChild(el);
            void el.offsetWidth;
            var lines = msgBox.querySelectorAll('.msg-line');
            if(lines.length > 3) lines[0].remove();
            lines.forEach((l, i) => {
                if(i === lines.length - 1) setTimeout(() => l.className = 'msg-line center', 50);
                else if(i === lines.length - 2) l.className = 'msg-line top';
                else l.className = 'msg-line exit';
            });
        };

        // 扉を開く
        entrance.style.opacity = '0';
        gameUI.style.display = 'block';
        setTimeout(() => { entrance.style.display = 'none'; document.getElementById('bg-image').style.opacity = '1'; }, 800);
        
        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
        await wait(2400);

        // --- 1. スタック出現 ➡ 指定順序のトップディール ---
        var currentA = [...currentPattern.A].sort(() => Math.random() - 0.5);
        var currentB = [...currentPattern.B].sort(() => Math.random() - 0.5);

        var cards = [];
        for(var i=0; i<5; i++) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = i; 
            c.innerHTML = '<div class="card-inner"><div class="card-face card-front" style="background-image:url(\''+currentA[i]+'\')"></div><div class="card-face card-back"></div></div>';
            table.appendChild(c);
            cards.push(c);
        }
        await wait(100);
        cards.forEach(c => { c.style.transition = "opacity 1.5s ease"; c.classList.add('is-visible'); });
        await wait(1800);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。");
        
        var positions = [-330, -165, 0, 165, 330];
        var dealTasks = [
            { cardIdx: 4, posIdx: 0, delay: 0 },   // 1枚目 -> 左端
            { cardIdx: 3, posIdx: 1, delay: 450 }, // 2枚目 -> 左中
            { cardIdx: 2, posIdx: 4, delay: 900 }, // 3枚目 -> 右端
            { cardIdx: 1, posIdx: 3, delay: 1350 },// 4枚目 -> 右中
            { cardIdx: 0, posIdx: 2, delay: -1 }   // 5枚目 -> 中央保持
        ];

        for (let task of dealTasks) {
            let c = cards[task.cardIdx];
            let diff = task.posIdx - 2;
            let tx = positions[task.posIdx];
            let ty = Math.abs(diff) * Math.abs(diff) * 15;
            let rot = diff * 12;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transition = "transform 0.9s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s";
            if (task.delay !== -1) {
                setTimeout(() => { c.style.transform = "translate("+tx+"px, "+ty+"px) rotate("+rot+"deg)"; }, task.delay);
            } else {
                c.style.transform = "translate(0,0) rotate(0deg)";
            }
        }
        await wait(2800);

        cards.forEach((c) => {
            c.classList.add('floating');
            setTimeout(() => { c.classList.remove('is-back'); }, 300);
        });
        await wait(1500);

        // --- 2. カウントダウン ---
        timerDisplay.style.opacity = "1";
        for (var i = 8; i >= 0; i--) {
            timerDisplay.innerText = i;
            if (i === 6) {
                dynamicText.innerHTML = "スマートフォンのマイクにも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。";
                dynamicText.style.opacity = "1";
            }
            if (i === 0) break;
            await wait(1000);
        }
        timerDisplay.style.opacity = "0";
        dynamicText.style.opacity = "0";
        await wait(500);

        // 集合
        cards.forEach(c => {
            c.className = 'card is-back is-visible';
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translate(0, 0) rotate(0deg)";
        });
        await wait(1500);

        // --- 3. 真の【右左右】アンカー・シャッフル ---
        var getDeck = () => [...cards].sort((a,b) => a.style.zIndex - b.style.zIndex);
        var shuffleSteps = [{x:180, r:12},{x:-180, r:-12},{x:180, r:10}];
        dynamicText.style.opacity = "0.3"; 

        for (var j=0; j<shuffleSteps.length; j++) {
            var deck = getDeck();
            var pull = deck[3]; 
            var step = shuffleSteps[j];
            dynamicText.innerText = "Now Shuffling...";
            pull.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
            pull.style.transform = "translate("+step.x+"px, -50px) rotate("+step.r+"deg)";
            await wait(650);
            var maxZ = Math.max(...cards.map(el => parseInt(el.style.zIndex)));
            pull.style.zIndex = maxZ + 1;
            pull.style.transform = "translate(0, 0) rotate(0deg)";
            await wait(450);
        }
        dynamicText.style.opacity = "0";
        await wait(1000);

        // --- 4. 消失 ---
        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        var finalDeck = getDeck();
        finalDeck.forEach((c, i) => {
            var diff = i - 2;
            var tx = diff * 145;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * 10;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = "translate("+tx+"px, "+ty+"px) rotate("+rot+"deg)";
        });
        await wait(1800);

        var vCard = finalDeck[2]; 
        vCard.className = 'card is-back is-visible';
        vCard.style.zIndex = 500;
        vCard.querySelector('.card-back').classList.add('glow');
        await wait(1500);

        var vTx = vCard.style.getPropertyValue('--base-tx');
        vCard.style.transition = "transform 4s ease-in-out, opacity 2.5s, filter 2s";
        vCard.style.transform = "translate("+vTx+", -185px) rotate(3deg)"; 
        await wait(3500);
        vCard.style.opacity = '0'; vCard.style.filter = 'blur(30px)';
        await wait(1000);

        // --- 5. フィナーレ（クロスフェード） ---
        pushMsg("あなたのカードだけが、消えました。");
        var remaining = cards.filter(c => c !== vCard);
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = "url('"+currentB[i]+"')");
        await wait(1200);

        for (var k = 0; k < remaining.length; k++) {
            await wait(k === 3 ? 750 : 450);
            remaining[k].classList.remove('is-back');
            remaining[k].classList.add('floating');
        }
        await wait(2000);

        msgBox.style.opacity = "0";
        dynamicText.innerHTML = "奇跡を感じましたか？<br>Gran GIOIA Ginzaでは、<br>あなたの眼の前で「奇跡」をお届けします。";
        dynamicText.style.marginTop = "-40px";
        dynamicText.style.opacity = "1";

        await wait(3500); 
        
        table.style.opacity = '0';
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => { 
            reserveUI.style.opacity = 1; 
            document.getElementById('status-info').style.opacity = 0; 
        }, 100);
    }
</script>
</body>
</html>
