<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        :root {
            --card-w: 21vw;
            --card-h: calc(var(--card-w) * 1.5);
            --max-card-w: 130px;
            --max-card-h: 195px;
        }
        @media (min-width: 600px) {
            :root { --card-w: var(--max-card-w); --card-h: var(--max-card-h); }
        }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #f1d592; font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); z-index: 1; }
        #bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('./SocialCover.webp') center/cover no-repeat; z-index: 2; opacity: 0; transition: opacity 2s; }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 3; }
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        #entrance { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); }
        .entrance-logo { font-size: 1.4rem; letter-spacing: 0.2em; margin-bottom: 50px; text-align: center; text-shadow: 0 0 20px #000; padding: 0 20px; line-height: 1.6; }
        .start-btn { background: #f1d592; color: #000; border: none; padding: 20px 45px; font-size: 1.1rem; font-weight: bold; cursor: pointer; letter-spacing: 0.2em; min-width: 240px; box-shadow: 0 0 30px rgba(241,213,146,0.5); }

        #game-ui { width: 100%; margin-top: 5vh; display: none; }
        #msg-container { height: 100px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .msg-line { position: absolute; width: 90%; display: flex; align-items: center; justify-content: center; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.1rem; letter-spacing: 0.1em; text-shadow: 0 0 25px #000; line-height: 1.4; }
        .msg-line.center { opacity: 1; transform: translateY(0); }

        #sub-msg-area { height: 160px; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 50; }
        #timer { font-size: 5rem; font-weight: bold; color: #fff; opacity: 0; text-shadow: 0 0 50px #000; transition: opacity 0.5s; height: 100px; display: flex; align-items: center; }
        #dynamic-text { opacity: 0; transition: opacity 1.2s ease; font-size: 1rem; letter-spacing: 0.05em; color: #f1d592; text-align: center; line-height: 1.6; text-shadow: 0 0 20px #000; padding: 0 15px; position: absolute; top: 90px; }

        #card-table { height: 350px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; transition: opacity 2s ease; margin-top: 10px; }
        .card { width: var(--card-w); height: var(--card-h); max-width: var(--max-card-w); max-height: var(--max-card-h); position: absolute; left: 50%; margin-left: calc(var(--card-w) / -2); perspective: 1200px; opacity: 0; pointer-events: none; transition: transform 0.8s, opacity 0.8s, filter 2.5s ease-in-out; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        @keyframes magicFloat { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 12px)) rotate(calc(var(--base-rot) + 1.2deg)); } 
        }
        .floating { animation: magicFloat 3.5s infinite ease-in-out !important; }
        
        /* 修正：ジワッと光る形状追従グロウ */
        .glow { filter: drop-shadow(0 0 15px #f1d592) drop-shadow(0 0 35px #f1d592) !important; }
        
        #reserve-ui { position: absolute; top: 68%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2s ease; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn { background: #f1d592; border: none; padding: 18px 30px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1rem; width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-decoration: none; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.05); }
        .btn.secondary { background: none; border: 1px solid #f1d592; color: #f1d592; }

        #status-info { position: fixed; bottom: 8px; right: 8px; font-size: 9px; color: #f1d592; z-index: 10001; background: rgba(0,0,0,0.8); padding: 4px 8px; border: 1px solid #f1d592; opacity: 0.6; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-image"></div>
<div id="bg-curtain"></div>
<div id="status-info">Build: 11400 | Luminous Tune</div>

<div id="entrance">
    <div class="entrance-logo">マジックレストラン Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">-Card Magic Experience-</span></div>
    <button class="start-btn" onclick="igniteMiracle()">奇跡を体験する</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="sub-msg-area">
            <div id="timer">8</div>
            <div id="dynamic-text"></div>
        </div>
        <div id="card-table"></div>
    </div>
    <div id="reserve-ui">
        <div class="btn-group">
            <a href="https://ginzagioia.studio.site/reservation" class="btn">特別な夜を予約する</a>
            <button class="btn secondary" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    var isStarted = false;
    
    const PATTERNS = [
        { A: ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'], B: ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'] },
        { A: ['./10S.webp', './9C.webp', './8D.webp', './9H.webp', './8C.webp'], B: ['./10C.webp', './9S.webp', './8H.webp', './9D.webp'] },
        { A: ['./6H.webp', './5D.webp', './6C.webp', './4S.webp', './5C.webp'], B: ['./6D.webp', './5H.webp', './6S.webp', './4C.webp'] }
    ];

    function getPattern() {
        let count = parseInt(localStorage.getItem('gioia_magic_cycles') || '0');
        localStorage.setItem('gioia_magic_cycles', (count + 1).toString());
        return PATTERNS[count % PATTERNS.length];
    }

    function sharePage() {
        var url = window.location.href.split('?')[0];
        var shareTitle = 'マジックレストラン Gran GIOIA Ginza -Card Magic Experience-';
        if (navigator.share) { navigator.share({ title: shareTitle, url: url }); }
        else { alert("リンクをコピーしました：\n" + url); }
    }

    async function igniteMiracle() {
        if(isStarted) return;
        isStarted = true;

        var pattern = getPattern(); 
        var gameUI = document.getElementById('game-ui');
        var msgBox = document.getElementById('msg-container');
        var dynamicText = document.getElementById('dynamic-text');
        var timerDisplay = document.getElementById('timer');
        var table = document.getElementById('card-table');
        var wait = ms => new Promise(r => setTimeout(r, ms));

        var pushMsg = (txt) => {
            var el = document.createElement('div');
            el.className = 'msg-line bottom';
            el.innerHTML = txt;
            msgBox.appendChild(el);
            void el.offsetWidth;
            var lines = msgBox.querySelectorAll('.msg-line');
            if(lines.length > 2) lines[0].remove();
            lines.forEach((l, i) => {
                if(i === lines.length - 1) setTimeout(() => l.className = 'msg-line center', 50);
                else l.className = 'msg-line top';
            });
        };

        document.getElementById('entrance').style.opacity = '0';
        gameUI.style.display = 'block';
        setTimeout(() => { document.getElementById('entrance').style.display = 'none'; document.getElementById('bg-image').style.opacity = '1'; }, 800);
        
        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
        await wait(2400);

        // --- 1. 山札生成 ---
        var currentA = [...pattern.A].sort(() => Math.random() - 0.5);
        var currentB = [...pattern.B].sort(() => Math.random() - 0.5);
        var cards = [];
        for(var i=0; i<5; i++) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = (i + 1) * 10; 
            c.innerHTML = '<div class="card-inner"><div class="card-face card-front" style="background-image:url(\''+currentA[i]+'\')"></div><div class="card-face card-back"></div></div>';
            table.appendChild(c);
            cards.push(c);
        }
        await wait(100);
        cards.forEach(c => { c.style.transition = "opacity 1.5s ease"; c.classList.add('is-visible'); });
        await wait(1800);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。");
        
        var winW = window.innerWidth;
        var span = (winW < 600) ? winW * 0.16 : 160; 
        var targets = [
            { tx: -2 * span, ty: 24, rot: -24 },
            { tx: -1 * span, ty: 12, rot: -12 },
            { tx: 0, ty: 0, rot: 0 },
            { tx: 1 * span, ty: 12, rot: 12 },
            { tx: 2 * span, ty: 24, rot: 24 }
        ];

        cards.forEach(c => {
            c.style.transition = "transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)";
            c.style.transform = `translate(${targets[0].tx}px, ${targets[0].ty}px) rotate(${targets[0].rot}deg)`;
        });
        await wait(900);

        for (let i = 0; i < cards.length; i++) {
            let droppedCard = cards[i];
            let t = targets[i];
            for (let j = i; j < cards.length; j++) {
                cards[j].style.transition = "transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)";
                cards[j].style.transform = `translate(${t.tx}px, ${t.ty}px) rotate(${t.rot}deg)`;
            }
            droppedCard.style.setProperty('--base-tx', t.tx + "px");
            droppedCard.style.setProperty('--base-ty', t.ty + "px");
            droppedCard.style.setProperty('--base-rot', t.rot + "deg");
            await wait(350);
        }
        await wait(500);

        for (let i = 0; i < cards.length; i++) {
            let c = cards[i];
            setTimeout(() => {
                c.style.animationDelay = (Math.random() * 2).toFixed(2) + "s";
                c.classList.add('floating');
                c.classList.remove('is-back');
            }, i * 400);
        }
        await wait(2000);

        // --- 2. カウントダウン ---
        timerDisplay.style.opacity = "1";
        for (var i = 8; i >= 0; i--) {
            timerDisplay.innerText = i;
            if (i === 6) {
                dynamicText.innerHTML = "スマートフォンのマイクにも聞こえないように<br>頭の中で、3回マークと数字を読み上げてください。";
                dynamicText.style.opacity = "1";
            }
            if (i === 0) break;
            await wait(1000);
        }
        timerDisplay.style.opacity = "0";
        dynamicText.style.opacity = "0";
        await wait(500);

        cards.forEach(c => {
            c.className = 'card is-back is-visible';
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translate(0, 0) rotate(0deg)";
        });
        await wait(1500);

        // --- 3. シャッフル ---
        // ★修正：スマホでのスライド距離を微調整（抜けきりつつ大きすぎない）
        var moveX = (winW < 600) ? winW * 0.28 : 160;
        var shuffleSteps = [{x:moveX, r:12},{x:-moveX, r:-12},{x:moveX, r:10}];
        dynamicText.style.opacity = "0.7"; // 明るく調整
        for (var j=0; j<shuffleSteps.length; j++) {
            let deck = [...cards].sort((a,b) => parseInt(a.style.zIndex) - parseInt(b.style.zIndex));
            let pull = deck[3]; 
            let step = shuffleSteps[j];
            dynamicText.innerText = "Now Shuffling...";
            pull.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)";
            pull.style.transform = `translate(${step.x}px, -50px) rotate(${step.r}deg)`;
            await wait(650);
            let maxZ = Math.max(...cards.map(el => parseInt(el.style.zIndex)));
            pull.style.zIndex = maxZ + 1;
            pull.style.transform = "translate(0, 0) rotate(0deg)";
            await wait(450);
        }
        dynamicText.style.opacity = "0";
        await wait(1000);

        // --- 4. 消失演出 ---
        // ★修正：メッセージ変更
        pushMsg("あなたの頭の中にあるカードはきっとコチラ….");
        let finalDeck = [...cards].sort((a,b) => parseInt(a.style.zIndex) - parseInt(b.style.zIndex));
        let fSpan = (winW < 600) ? winW * 0.16 : 145;
        finalDeck.forEach((c, i) => {
            let diff = i - 2;
            let tx = diff * fSpan;
            let ty = Math.abs(diff) * 10;
            let rot = diff * 10;
            c.style.zIndex = (i + 1) * 10; 
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
        });
        await wait(1800);

        // ★修正：ジワッと光る（CSSのtransition 2.5sで補完）
        var vCard = finalDeck[2]; 
        vCard.classList.add('glow'); 
        await wait(2500); 

        var vTx = vCard.style.getPropertyValue('--base-tx');
        vCard.style.transition = "transform 4s ease-in-out, opacity 2.5s, filter 2s";
        vCard.style.transform = `translate(${vTx}, -180px) rotate(3deg)`; 
        await wait(3500);
        vCard.style.opacity = '0'; vCard.style.filter = 'blur(30px) brightness(2)';
        await wait(1000);

        // --- 5. フィナーレ ---
        pushMsg("あなたのカードだけが、消えました。");
        var remaining = cards.filter(c => c !== vCard).sort((a, b) => {
            return parseFloat(a.style.getPropertyValue('--base-tx')) - parseFloat(b.style.getPropertyValue('--base-tx'));
        });
        
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = `url('${currentB[i]}')`);
        await wait(1200);

        for (var k = 0; k < remaining.length; k++) {
            await wait(500);
            remaining[k].classList.remove('is-back');
            remaining[k].classList.add('floating');
        }
        await wait(2000);

        msgBox.style.opacity = "0";
        dynamicText.style.top = "10px";
        dynamicText.innerHTML = "奇跡を感じましたか？<br>Gran GIOIA Ginzaでは、<br>あなたの眼の前で「奇跡」をお届けします。";
        dynamicText.style.opacity = "1";
        dynamicText.style.fontSize = "1.2rem";

        await wait(3500); 
        table.style.opacity = '0';
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => { 
            reserveUI.style.opacity = 1; 
            document.getElementById('status-info').style.opacity = 0; 
        }, 100);
    }
</script>
</body>
</html>
