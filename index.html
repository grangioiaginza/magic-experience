<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza</title>
    <style>
        /* --- 基本レイアウト --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #f1d592; font-family: "Yu Mincho", serif; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('./SocialCover.webp') center/cover no-repeat; z-index: 1; }
        #bg-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 2; }
        
        .container { position: relative; width: 100vw; height: 100vh; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        /* エントランス */
        #entrance {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: transparent; transition: opacity 0.8s ease;
        }
        .entrance-logo { font-size: 1.8rem; letter-spacing: 0.3em; margin-bottom: 40px; text-align: center; text-shadow: 0 0 25px #000; }
        .start-btn { 
            background: none; border: 1px solid #f1d592; color: #f1d592; padding: 20px 50px; 
            font-size: 1.2rem; cursor: pointer; transition: all 0.3s; letter-spacing: 0.2em;
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
        }
        .start-btn:hover { background: #f1d592; color: #000; box-shadow: 0 0 30px #f1d592; }

        /* ナレーションエリア */
        #game-ui { width: 100%; margin-top: 5vh; display: none; opacity: 0; transition: opacity 1s; }
        #msg-container { height: 160px; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .msg-line { 
            position: absolute; width: 100%; display: flex; align-items: center; justify-content: center;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 25px #000; white-space: nowrap;
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(60px); }
        .msg-line.finale { opacity: 1; transition: opacity 2s; position: static; transform: none; margin: 10px 0; }

        /* カード配置 */
        #card-table { height: 420px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; transition: opacity 2s; }
        .card { 
            width: 130px; height: 195px; position: absolute; 
            left: 50%; transform: translateX(-50%);
            perspective: 1200px; opacity: 0; pointer-events: none;
            transition: opacity 1.5s ease;
        }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.5px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        /* アニメーション */
        @keyframes magicFloat { 
            0%, 100% { transform: translateX(calc(-50% + var(--base-tx))) translateY(var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translateX(calc(-50% + var(--base-tx))) translateY(calc(var(--base-ty) - 15px)) rotate(calc(var(--base-rot) + 1.5deg)); } 
        }
        .floating { animation: magicFloat 3.8s infinite ease-in-out !important; }
        .glow { box-shadow: 0 0 60px 20px #f1d592 !important; transition: box-shadow 2.5s; }

        #timer { height: 100px; font-size: 6rem; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; text-shadow: 0 0 50px #000; }
        
        /* 最終アクションエリア */
        #reserve-ui { 
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); 
            width: 100%; opacity: 0; z-index: 8000; text-align: center; display: none; transition: 2.5s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .btn { background: #f1d592; border: none; padding: 20px 60px; border-radius: 60px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 15px 35px rgba(241,213,146,0.3); }
        .btn.secondary { background: none; border: 1px solid #f1d592; color: #f1d592; }

        #status-info { position: fixed; bottom: 12px; right: 12px; font-size: 10px; color: #f1d592; z-index: 10000; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #f1d592; opacity: 1; }
    </style>
</head>
<body>

<div id="bg-canvas"></div>
<div id="bg-curtain"></div>

<div id="status-info">Build: 7600 | Magic Initialized</div>

<div id="entrance">
    <div class="entrance-logo">Gran GIOIA Ginza<br><span style="font-size: 0.8rem; opacity: 0.7;">Card Magic Experience</span></div>
    <button class="start-btn" onclick="ignite(this)">奇跡の扉を開く</button>
</div>

<div class="container">
    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="timer">8</div>
        <div id="card-table"></div>
    </div>

    <div id="reserve-ui">
        <div class="btn-group">
            <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
            <button class="btn secondary" onclick="sharePage()">このマジックを誰かに見せる</button>
        </div>
    </div>
</div>

<script>
    var SET_A = ['./JH.webp', './KD.webp', './QS.webp', './QD.webp', './JC.webp'];
    var SET_B = ['./JS.webp', './JD.webp', './QC.webp', './QH.webp'];
    var table, timer, msgBox, currentB;

    function log(t) { document.getElementById('status-info').innerText = "Build: 7600 | " + t; }
    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    function pushMsg(txt, isFinale = false) {
        if(!msgBox) return;
        var el = document.createElement('div');
        el.className = isFinale ? 'msg-line finale' : 'msg-line bottom';
        el.innerHTML = txt;
        msgBox.appendChild(el);
        void el.offsetWidth;
        
        if(isFinale) return el;

        var lines = msgBox.querySelectorAll('.msg-line:not(.finale)');
        if(lines.length > 3) lines[0].remove();
        lines.forEach(function(l, idx) {
            if(idx === lines.length - 1) { setTimeout(() => l.className = 'msg-line center', 50); }
            else if(idx === lines.length - 2) { l.className = 'msg-line top'; }
            else { l.className = 'msg-line exit'; }
        });
    }

    function applyFan(cards, spacing, rotUnit) {
        cards.forEach(function(c, i) {
            var diff = i - (cards.length - 1) / 2;
            var tx = diff * spacing;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * rotUnit;
            c.style.transition = "transform 1.2s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s";
            c.style.opacity = 1;
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = "translateX(calc(-50% + " + tx + "px)) translateY(" + ty + "px) rotate(" + rot + "deg)";
        });
    }

    function sharePage() {
        var url = window.location.href.split('?')[0];
        if (navigator.share) {
            navigator.share({ title: 'Gran GIOIA Ginza', url: url });
        } else {
            alert("リンクをコピーしました。大切な人に送ってください。\n" + url);
        }
    }

    async function ignite(btn) {
        table = document.getElementById('card-table');
        timer = document.getElementById('timer');
        msgBox = document.getElementById('msg-container');
        
        document.getElementById('entrance').style.opacity = '0';
        document.getElementById('game-ui').style.display = 'block';
        setTimeout(() => {
            document.getElementById('entrance').style.display = 'none';
            document.getElementById('game-ui').style.opacity = '1';
        }, 800);

        await wait(1000);
        pushMsg("これより\"奇跡\"を味わってもらいたいと思います。");
        
        var currentA = [...SET_A].sort(() => Math.random() - 0.5);
        currentB = [...SET_B].sort(() => Math.random() - 0.5);
        
        currentA.forEach(function(img, i) {
            var c = document.createElement('div');
            c.className = 'card is-back';
            c.style.zIndex = i;
            c.innerHTML = '<div class="card-inner"><div class="card-face card-front" style="background-image:url(\''+img+'\')"></div><div class="card-face card-back"></div></div>';
            table.appendChild(c);
            setTimeout(() => c.classList.add('is-visible'), 500); 
        });
        await wait(2200);

        pushMsg("この五枚の中から、直感で一枚を頭の中で選んでください。");
        var cards = document.querySelectorAll('.card');
        applyFan(cards, 165, 12);
        await wait(2500);

        pushMsg("スマートフォンのマイクにも聞こえないように");
        await wait(1000);
        pushMsg("頭の中で、3回マークと数字を読み上げてください。");
        await wait(2500);

        for (var i = 0; i < cards.length; i++) {
            cards[i].classList.remove('is-back');
            cards[i].classList.add('floating');
            await wait(250);
        }

        timer.style.opacity = 1;
        for (var i = 8; i >= 0; i--) { timer.innerText = i; if(i===0) break; await wait(950); }
        timer.style.opacity = 0;

        // --- 集合 ---
        cards.forEach(function(c) {
            c.className = 'card is-back is-visible'; 
            c.style.animation = "none";
            void c.offsetWidth;
            c.style.transition = "transform 1.2s cubic-bezier(0.19, 1, 0.22, 1)";
            c.style.transform = "translateX(-50%) translateY(0) rotate(0deg)";
        });
        await wait(1500);

        // --- 真の【中抜き】シャッフル ---
        // 視覚的に一番上のカード(zIndex 4)を不動にし、その下(Index 3)を抜く
        var deck = Array.from(cards).sort((a,b) => a.style.zIndex - b.style.zIndex);
        var pulls = [{idx:3, x:280}, {idx:0, x:-280}, {idx:1, x:240}];
        var topZ = 100;
        
        for (var i = 0; i < pulls.length; i++) {
            var targetIdx = pulls[i].idx;
            var c = deck[targetIdx];
            // 視覚的な重なりを一番上へ（抜いた瞬間にzIndexを更新）
            c.style.zIndex = topZ++;
            c.style.transition = "transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1)";
            c.style.transform = "translateX(calc(-50% + " + pulls[i].x + "px)) translateY(-75px) rotate(18deg)";
            await wait(650);
            c.style.transform = "translateX(-50%) translateY(0) rotate(0deg)";
            await wait(450);
            // 内部論理でも一番上へ
            deck.push(deck.splice(targetIdx, 1)[0]);
        }
        await wait(800);

        pushMsg("あなたの頭の中にあるカードを消してみせます...");
        applyFan(deck, 145, 10);
        await wait(1800);

        // --- 黄金の消失 ---
        var vCard = deck[2];
        vCard.className = 'card is-back is-visible';
        vCard.style.zIndex = 500;
        vCard.querySelector('.card-back').classList.add('glow');
        await wait(1500);

        var finalTx = vCard.style.getPropertyValue('--base-tx');
        vCard.style.transition = "transform 4.0s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 2.5s, opacity 2.5s, filter 2.5s";
        vCard.style.transform = "translateX(calc(-50% + " + finalTx + ")) translateY(-200px) rotate(3deg)";
        await wait(3500);
        vCard.style.opacity = "0";
        vCard.style.filter = "blur(30px)";
        await wait(1000);

        pushMsg("あなたのカードだけが、消えました。");
        var remaining = deck.filter((_, idx) => idx !== 2);
        remaining.forEach((c, i) => c.querySelector('.card-front').style.backgroundImage = "url('"+currentB[i]+"')");
        await wait(1200);

        for (var i = 0; i < remaining.length; i++) {
            var c = remaining[i];
            await wait(i === 3 ? 900 : 600); // 焦らし短縮
            c.style.transition = "transform 0.8s";
            c.classList.remove('is-back'); 
            c.classList.add('floating'); 
        }

        await wait(2000);
        
        // --- フィナーレ・クロスフェード ---
        // 既存のナレーションを消す
        var oldLines = msgBox.querySelectorAll('.msg-line:not(.finale)');
        oldLines.forEach(l => l.style.opacity = '0');
        await wait(500);
        
        // 3行を上部エリアにまとめて表示
        pushMsg("不思議を感じましたか？", true);
        await wait(800);
        pushMsg("Gran GIOIA Ginzaでは、", true);
        await wait(800);
        pushMsg("「このレベルではない奇跡」をお届けします。", true);
        
        await wait(4000);
        
        // クロスフェード開始
        table.style.opacity = "0";
        var reserveUI = document.getElementById('reserve-ui');
        reserveUI.style.display = 'block';
        setTimeout(() => reserveUI.style.opacity = 1, 100);

        log("Magic: Complete");
    }
</script>
</body>
</html>
