<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gran GIOIA Ginza -Card Magic-</title>
    <style>
        /* 1. 基本レイアウト */
        body { background-color: #000; color: #f1d592; font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .container { 
            min-height: 100vh; width: 100vw; position: relative; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            padding-top: 5vh; 
            background: url('./SocialCover.webp') center/cover no-repeat;
        }
        /* 背景を少し暗くするオーバーレイ */
        .container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1; }
        
        #game-ui { position: relative; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center; }

        /* 2. メッセージエリア：PC/スマホ共に完全中央 */
        #msg-container { height: 160px; width: 100%; position: relative; overflow: visible; }
        .msg-line { 
            position: absolute; left: 50%; top: 50%; width: 90%;
            transform: translate(-50%, -50%);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); 
            opacity: 0; font-size: 1.4rem; font-weight: normal; line-height: 1.6; letter-spacing: 0.15em; 
            text-shadow: 0 0 20px rgba(0,0,0,1); white-space: nowrap;
        }
        .msg-line.center { opacity: 1; transform: translate(-50%, -50%); }
        .msg-line.top { opacity: 0.3; transform: translate(-50%, -100%) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translate(-50%, -150%); }
        .msg-line.bottom { opacity: 0; transform: translate(-50%, 50%); }

        /* 3. カウントダウン */
        #timer { 
            height: 100px; font-size: 6rem; font-weight: bold; color: #fff; 
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; font-family: serif;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 50px #000;
        }

        /* 4. カードテーブル */
        #card-table { height: 400px; position: relative; width: 100%; max-width: 900px; display: flex; justify-content: center; align-items: center; }
        .card { width: 130px; height: 195px; position: absolute; perspective: 1000px; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.3px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('./back.webp'); background-color: #1a1a1a; }

        /* 5. 特殊エフェクト：弧を描きながら浮遊 */
        @keyframes float { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 20px)) rotate(calc(var(--base-rot) + 2deg)); } 
        }
        .floating { animation: float 3.5s infinite ease-in-out; }
        
        .juwa-in { animation: juwa-in 1.5s forwards; }
        @keyframes juwa-in { from { opacity: 0; filter: blur(20px); } to { opacity: 1; filter: blur(0); } }
        
        .juwa-out { animation: juwa-out 3.0s forwards; } 
        @keyframes juwa-out { from { opacity: 1; filter: blur(0); transform: scale(1); } to { opacity: 0; filter: blur(45px); transform: scale(1.6); } }

        /* 6. フィナーレ */
        #reserve-ui { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 600; transition: 2s; text-align: center; }
        .btn { background: #f1d592; border: none; padding: 18px 55px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; box-shadow: 0 5px 25px rgba(0,0,0,0.6); }
        
        .hidden { display: none !important; }
        #version-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: rgba(241,213,146,0.4); z-index: 2000; }
        #orientation-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; visibility: hidden; opacity: 0; }
        @media screen and (max-width: 900px) and (orientation: portrait) { #orientation-overlay { visibility: visible; opacity: 1; } }
    </style>
</head>
<body>
