<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マジックレストラン Gran GIOIA Ginza -Card Magic Experience-</title>
    <style>
        /* 1. ブラックアウト対策：堅牢なレイアウト */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050505; color: #f1d592; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; overflow: hidden; }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('SocialCover.webp') center/cover no-repeat; z-index: 1; }
        .overlay-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); z-index: 2; }
        .container { position: relative; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        #game-ui { width: 100%; margin-top: 5vh; }

        /* 2. メッセージ：完全中央 */
        #msg-container { height: 160px; width: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .msg-line { 
            position: absolute; width: 100%; display: flex; align-items: center; justify-content: center;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); opacity: 0; font-size: 1.4rem; letter-spacing: 0.15em; text-shadow: 0 0 20px #000; white-space: nowrap;
        }
        .msg-line.center { opacity: 1; transform: translateY(0); }
        .msg-line.top { opacity: 0.3; transform: translateY(-60px) scale(0.9); }
        .msg-line.exit { opacity: 0; transform: translateY(-120px); }
        .msg-line.bottom { opacity: 0; transform: translateY(60px); }

        /* 3. カードテーブル */
        #card-table { height: 400px; width: 100%; max-width: 900px; position: relative; display: flex; justify-content: center; align-items: center; }
        .card { width: 130px; height: 195px; position: absolute; perspective: 1000px; opacity: 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s; transform-style: preserve-3d; }
        .card.is-back .card-inner { transform: rotateY(180deg); }
        .card.is-visible { opacity: 1; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background-size: cover; background-position: center; border: 0.3px solid rgba(241,213,146,0.3); }
        .card-back { transform: rotateY(180deg); background-image: url('back.webp'); background-color: #1a1a1a; }

        /* 4. 特殊演出 */
        @keyframes float { 
            0%, 100% { transform: translate(var(--base-tx), var(--base-ty)) rotate(var(--base-rot)); } 
            50% { transform: translate(var(--base-tx), calc(var(--base-ty) - 20px)) rotate(calc(var(--base-rot) + 2deg)); } 
        }
        .floating { animation: float 3.5s infinite ease-in-out !important; }
        .glow { box-shadow: 0 0 70px 30px #f1d592 !important; transition: box-shadow 1.5s ease-in-out; }

        #timer { height: 100px; font-size: 6rem; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; text-shadow: 0 0 50px #000; }
        #reserve-ui { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 100%; opacity: 0; z-index: 600; text-align: center; display: none; transition: 2s; }
        .btn { background: #f1d592; border: none; padding: 18px 55px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #000; font-size: 1.2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        #status-info { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: rgba(241,213,146,0.4); z-index: 2000; background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="overlay-layer"></div>

<div class="container">
    <div id="status-info">Build: 4500 | Ignition</div>

    <div id="game-ui">
        <div id="msg-container"></div>
        <div id="timer">8</div>
        <div id="card-table"></div>
    </div>

    <div id="reserve-ui">
        <button class="btn" onclick="location.href='https://ginzagioia.studio.site/reservation'">特別な夜を予約する</button>
    </div>
</div>

    function log(t) { document.getElementById('status-info').innerText = "Build: 4500 | " + t; }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    function pushMsg(txt) {
        var el = document.createElement('div');
        el.className = 'msg-line bottom';
        el.innerHTML = txt;
        msgBox.appendChild(el);
        var lines = msgBox.querySelectorAll('.msg-line');
        if(lines.length > 3) lines[0].remove();
        lines.forEach(function(l, idx) {
            if(idx === lines.length - 1) { setTimeout(() => l.className = 'msg-line center', 50); }
            else if(idx === lines.length - 2) { l.className = 'msg-line top'; }
            else { l.className = 'msg-line exit'; }
        });
    }

    function applyFan(cards, spacing, rotUnit) {
        cards.forEach(function(c, i) {
            var diff = i - (cards.length - 1) / 2;
            var tx = diff * spacing;
            var ty = Math.abs(diff) * Math.abs(diff) * 15;
            var rot = diff * rotUnit;
            c.style.transition = "transform 1.0s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s";
            c.style.opacity = 1;
            c.style.left = "calc(50% - 65px)";
            c.style.setProperty('--base-tx', tx + "px");
            c.style.setProperty('--base-ty', ty + "px");
            c.style.setProperty('--base-rot', rot + "deg");
            c.style.transform = "translate("+tx+"px, "+ty+"px) rotate("+rot+"deg)";
        });
    }
